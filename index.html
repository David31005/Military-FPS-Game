
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pittsburgh Streets</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#111;
 font-family:Arial,sans-serif;
 touch-action:none;overscroll-behavior:none
}
canvas{display:block;touch-action:none}
#title{
 position:absolute;top:calc(12px + env(safe-area-inset-top));
 width:100%;text-align:center;color:white;
 font-size:21px;font-weight:bold;
 text-shadow:2px 2px 5px black;pointer-events:none
}
#score{
 position:absolute;top:calc(50px + env(safe-area-inset-top));
 width:100%;text-align:center;color:#ffe36b;
 font-weight:bold;pointer-events:none
}
#crosshair{
 position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);
 color:white;font-size:32px;pointer-events:none
}
#hud{
 position:absolute;
 bottom:calc(165px + env(safe-area-inset-bottom));
 left:15px;color:white;font-size:16px;
 text-shadow:1px 1px 4px black;pointer-events:none
}
#message{
 position:absolute;top:calc(85px + env(safe-area-inset-top));
 width:100%;text-align:center;color:#ffe36b;
 font-weight:bold;text-shadow:1px 1px 4px black;
 pointer-events:none
}
#damage{
 position:absolute;inset:0;
 background:rgba(255,0,0,.4);
 opacity:0;pointer-events:none
}
#joystick{
 position:absolute;
 bottom:calc(25px + env(safe-area-inset-bottom));
 left:25px;width:125px;height:125px;
 border-radius:50%;border:2px solid #ffffff88;
 background:#ffffff33;touch-action:none
}
#stick{
 position:absolute;top:36px;left:36px;
 width:50px;height:50px;border-radius:50%;
 background:#ffffffbb;pointer-events:none
}
button{touch-action:none}
#fire{
 position:absolute;right:25px;
 bottom:calc(40px + env(safe-area-inset-bottom));
 width:95px;height:95px;border-radius:50%;
 background:#c62828;color:white;
 border:3px solid white;font-size:19px;
 font-weight:bold
}
#reload{
 position:absolute;right:40px;
 bottom:calc(145px + env(safe-area-inset-bottom));
 padding:10px 15px;background:#333c;
 color:white;border:1px solid white;
 border-radius:10px;font-weight:bold
}
#gameover{
 display:none;position:absolute;inset:0;
 background:#000d;color:white;z-index:10;
 align-items:center;justify-content:center;
 flex-direction:column;gap:20px;text-align:center
}
#restart{
 padding:15px 25px;background:#c62828;
 color:white;border:2px solid white;
 border-radius:12px;font-size:18px
}
</style>
</head>
<body>
<div id="damage"></div>
<div id="title">PITTSBURGH STREETS</div>
<div id="score">ELIMINATIONS: 0</div>
<div id="message"></div>
<div id="crosshair">+</div>
<div id="hud">HEALTH: 100 | AMMO: 30</div>
<div id="joystick"><div id="stick"></div></div>
<button id="fire">FIRE</button>
<button id="reload">RELOAD</button>
<div id="gameover">
 <h1>MISSION FAILED</h1>
 <div id="finalscore"></div>
 <button id="restart">RESTART MISSION</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91a6b2);
scene.fog=new THREE.Fog(0x91a6b2,25,110);

const camera=new THREE.PerspectiveCamera(
 75,innerWidth/innerHeight,.1,200
);
camera.position.set(0,1.7,8);
camera.rotation.order="YXZ";

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(
 0xffffff,0x555555,2
));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(10,20,10);
scene.add(sun);

function makeBox(parent,w,h,d,color,x,y,z){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 mesh.position.set(x,y,z);
 parent.add(mesh);
 return mesh;
}

// GROUND AND ROAD
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x527044})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

const road=new THREE.Mesh(
 new THREE.PlaneGeometry(12,160),
 new THREE.MeshStandardMaterial({color:0x303238})
);
road.rotation.x=-Math.PI/2;
road.position.y=.02;
scene.add(road);

makeBox(scene,3,.2,160,0x999999,-7.5,.1,0);
makeBox(scene,3,.2,160,0x999999,7.5,.1,0);

// BUILDINGS
const colors=[0x885544,0x777777,0x554c48,0x99775b];
for(let i=0;i<12;i++){
 const z=15-i*12;
 const h=7+(i%4)*2;
 makeBox(scene,8,h,9,colors[i%4],-13,h/2,z);
 makeBox(scene,8,h+2,9,colors[(i+1)%4],
 13,(h+2)/2,z);
}

// ROAD MARKINGS
for(let z=-70;z<70;z+=9){
 const line=new THREE.Mesh(
  new THREE.PlaneGeometry(.25,4),
  new THREE.MeshBasicMaterial({color:0xffd447})
 );
 line.rotation.x=-Math.PI/2;
 line.position.set(0,.04,z);
 scene.add(line);
}

// FIRST-PERSON RIFLE
const gun=new THREE.Group();
camera.add(gun);
scene.add(camera);

// Rifle visibility fix
gun.position.set(.28,-.18,-1.2);
gun.scale.set(1.4,1.4,1.4);

makeBox(gun,.22,.22,.65,0x30343a,0,0,0);
makeBox(gun,.12,.12,.7,0x171b20,0,.09,-.45);
makeBox(gun,.15,.25,.2,0x4d3b2e,0,-.2,.15);
makeBox(gun,.1,.12,.18,0x111111,0,.2,-.15);

// ENEMY SOLDIERS
const enemies=[];
const targets=[];

function createEnemy(x,z){
 const soldier=new THREE.Group();
 soldier.position.set(x,0,z);

 function part(w,h,d,c,px,py,pz){
  const mesh=makeBox(soldier,w,h,d,c,px,py,pz);
  mesh.userData.enemy=soldier;
  targets.push(mesh);
 }

 part(.35,.8,.4,0x252a25,-.24,.4,0);
 part(.35,.8,.4,0x252a25,.24,.4,0);
 part(1,1.1,.55,0x42543b,0,1.35,0);
 part(.3,.9,.4,0x42543b,-.65,1.4,0);
 part(.3,.9,.4,0x42543b,.65,1.4,0);
 part(.55,.55,.5,0x9a7255,0,2.15,0);
 part(.75,.25,.7,0x303e2b,0,2.5,0);
 part(.45,.45,.04,0xff3333,0,1.4,.3);

 soldier.userData={
  health:100,alive:true,
  homeX:x,homeZ:z,
  phase:Math.random()*6.28,
  cooldown:2,respawn:0
 };

 scene.add(soldier);
 enemies.push(soldier);
}

createEnemy(-3,-12);
createEnemy(3,-23);
createEnemy(-2,-35);
createEnemy(3,-48);
createEnemy(0,-62);

// IPHONE JOYSTICK
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let moveX=0,moveY=0,joyId=null;

function updateStick(e){
 const r=joystick.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const d=Math.hypot(x,y);
 const max=37;
 if(d>max){
  x=x/d*max;
  y=y/d*max;
 }
 moveX=x/max;
 moveY=y/max;
 stick.style.transform=
  "translate("+x+"px,"+y+"px)";
}

joystick.addEventListener("pointerdown",e=>{
 if(joyId!==null)return;
 joyId=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 updateStick(e);
});
joystick.addEventListener("pointermove",e=>{
 if(e.pointerId===joyId)updateStick(e);
});
function stopStick(e){
 if(e.pointerId!==joyId)return;
 joyId=null;moveX=0;moveY=0;
 stick.style.transform="translate(0px,0px)";
}
joystick.addEventListener("pointerup",stopStick);
joystick.addEventListener("pointercancel",stopStick);

// TOUCH AIMING
let lookId=null,lastX=0,lastY=0;
let yaw=0,pitch=0;

renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.clientX<innerWidth*.35||lookId!==null)return;
 lookId=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId!==lookId)return;
 yaw-=(e.clientX-lastX)*.004;
 pitch-=(e.clientY-lastY)*.004;
 pitch=Math.max(-1.2,Math.min(1.2,pitch));
 lastX=e.clientX;
 lastY=e.clientY;
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
});
function stopLook(e){
 if(e.pointerId===lookId)lookId=null;
}
renderer.domElement.addEventListener("pointerup",stopLook);
renderer.domElement.addEventListener("pointercancel",stopLook);

// GAME STATE
let health=100;
let ammo=30;
let eliminations=0;
let gameEnded=false;
let damageFlash=0;
let recoil=0;

const hud=document.getElementById("hud");
const score=document.getElementById("score");
const message=document.getElementById("message");

function updateHUD(){
 hud.textContent=
  "HEALTH: "+health+" | AMMO: "+ammo;
 score.textContent=
  "ELIMINATIONS: "+eliminations;
}

let messageTimer;
function showMessage(text){
 message.textContent=text;
 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>{
  message.textContent="";
 },1000);
}

// SHOOTING
const raycaster=new THREE.Raycaster();
const center=new THREE.Vector2(0,0);

function shoot(){
 if(gameEnded)return;
 if(ammo<=0){
  showMessage("OUT OF AMMO - RELOAD");
  return;
 }

 ammo--;
 recoil=.12;
 updateHUD();

 raycaster.setFromCamera(center,camera);
 raycaster.far=100;

 const hits=raycaster.intersectObjects(targets,false);
 const hit=hits.find(h=>
  h.object.userData.enemy.userData.alive
 );

 if(hit){
  const soldier=hit.object.userData.enemy;
  soldier.userData.health-=50;

  if(soldier.userData.health<=0){
   soldier.userData.alive=false;
   soldier.visible=false;
   soldier.userData.respawn=5;
   eliminations++;
   updateHUD();
   showMessage("ENEMY ELIMINATED!");
  }else{
   showMessage("ENEMY HIT!");
  }
 }else{
  showMessage("MISSED");
 }
}

document.getElementById("fire")
.addEventListener("pointerdown",e=>{
 e.preventDefault();
 shoot();
});

document.getElementById("reload")
.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(gameEnded)return;
 ammo=30;
 updateHUD();
 showMessage("RELOADED");
});

// ENEMY ATTACKS AND HEALTH DAMAGE
function takeDamage(amount){
 if(gameEnded)return;
 health=Math.max(0,health-amount);
 damageFlash=.5;
 updateHUD();
 showMessage("UNDER FIRE!");

 if(health<=0){
  gameEnded=true;
  moveX=0;moveY=0;
  document.getElementById("finalscore")
   .textContent="Eliminations: "+eliminations;
  document.getElementById("gameover")
   .style.display="flex";
 }
}

document.getElementById("restart")
.addEventListener("click",()=>{
 location.reload();
});

// GAME LOOP
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 if(!gameEnded){
  const speed=6;
  const forward=-moveY*speed*dt;
  const sideways=moveX*speed*dt;

  camera.position.x+=
   -Math.sin(yaw)*forward+
   Math.cos(yaw)*sideways;
  camera.position.z+=
   -Math.cos(yaw)*forward-
   Math.sin(yaw)*sideways;

  camera.position.x=Math.max(
   -8,Math.min(8,camera.position.x)
  );
  camera.position.z=Math.max(
   -75,Math.min(75,camera.position.z)
  );

  for(const enemy of enemies){
   const data=enemy.userData;

   if(!data.alive){
    data.respawn-=dt;
    if(data.respawn<=0){
     data.alive=true;
     data.health=100;
     enemy.visible=true;
     enemy.position.set(data.homeX,0,data.homeZ);
     data.cooldown=2;
    }
    continue;
   }

   // Patrol movement
   data.phase+=dt;
   enemy.position.x=Math.max(-4.5,Math.min(
    4.5,data.homeX+Math.sin(data.phase)*1.5
   ));

   const dx=camera.position.x-enemy.position.x;
   const dz=camera.position.z-enemy.position.z;
   const distance=Math.hypot(dx,dz);

   enemy.rotation.y=Math.atan2(dx,dz);
   data.cooldown-=dt;

   // Enemy shoots when nearby
   if(distance<23&&data.cooldown<=0){
    data.cooldown=2.5;
    takeDamage(10);
   }
  }

  recoil=Math.max(0,recoil-dt*.5);
  gun.position.z=-1.2+recoil;

  damageFlash=Math.max(0,damageFlash-dt);
  document.getElementById("damage")
   .style.opacity=damageFlash;
 }

 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
