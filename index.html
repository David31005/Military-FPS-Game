
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pittsburgh Streets - Step 9A</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#87a9c4;
 font-family:Arial,sans-serif;
 touch-action:none;overscroll-behavior:none
}
canvas{display:block;touch-action:none}
#title,#score,#mission,#message,#hud,#crosshair,#hitmarker{
 position:absolute;z-index:3;pointer-events:none;
 text-shadow:1px 2px 4px #000
}
#title{
 top:calc(10px + env(safe-area-inset-top));
 width:100%;text-align:center;color:white;
 font-size:21px;font-weight:bold
}
#score{
 top:calc(48px + env(safe-area-inset-top));
 width:100%;text-align:center;
 color:#ffe46b;font-weight:bold
}
#mission{
 top:calc(78px + env(safe-area-inset-top));
 width:100%;text-align:center;
 color:#00ff88;font-size:14px;font-weight:bold
}
#message{
 top:calc(108px + env(safe-area-inset-top));
 width:100%;text-align:center;
 color:#ffe46b;font-weight:bold
}
#crosshair{
 top:50%;left:50%;
 transform:translate(-50%,-50%);
 color:white;font-size:34px
}
#hitmarker{
 display:none;top:50%;left:50%;
 transform:translate(-50%,-50%);
 font-size:48px;font-weight:bold;color:white
}
#hud{
 left:15px;
 bottom:calc(165px + env(safe-area-inset-bottom));
 color:white;font-size:16px
}
#damage{
 position:absolute;inset:0;z-index:2;
 background:rgba(255,0,0,.35);
 opacity:0;pointer-events:none
}
#joystick{
 position:absolute;z-index:4;
 bottom:calc(25px + env(safe-area-inset-bottom));
 left:25px;width:125px;height:125px;
 border:2px solid #ffffff99;border-radius:50%;
 background:#ffffff33;touch-action:none
}
#stick{
 position:absolute;top:36px;left:36px;
 width:50px;height:50px;border-radius:50%;
 background:#ffffffbb;pointer-events:none
}
button{
 touch-action:none;user-select:none;
 -webkit-user-select:none
}
#fire{
 position:absolute;z-index:4;right:25px;
 bottom:calc(40px + env(safe-area-inset-bottom));
 width:95px;height:95px;border-radius:50%;
 background:#c62828;color:white;
 border:3px solid white;
 font-size:19px;font-weight:bold
}
#reload{
 position:absolute;z-index:4;right:135px;
 bottom:calc(145px + env(safe-area-inset-bottom));
 padding:10px 13px;background:#333;
 color:white;border:1px solid white;
 border-radius:10px;font-weight:bold
}
#aim{
 position:absolute;z-index:4;right:25px;
 bottom:calc(150px + env(safe-area-inset-bottom));
 width:88px;height:65px;
 border-radius:15px;
 background:#234d66;color:white;
 border:2px solid white;
 font-size:17px;font-weight:bold
}
#aim.active{background:#13865b}
#gameover{
 display:none;position:absolute;inset:0;
 z-index:10;background:#000e;color:white;
 align-items:center;justify-content:center;
 flex-direction:column;gap:20px;text-align:center
}
#restart{
 padding:15px 25px;background:#c62828;
 color:white;border:2px solid white;
 border-radius:12px;font-size:18px
}
#error{
 display:none;position:absolute;
 top:145px;left:10px;right:10px;
 z-index:20;color:white;background:#a00000;
 padding:12px;font-size:13px
}
</style>
</head>
<body>

<div id="damage"></div>
<div id="title">PITTSBURGH STREETS</div>
<div id="score">ELIMINATIONS: 0</div>
<div id="mission">MISSION: ELIMINATE 3 ENEMIES</div>
<div id="message"></div>
<div id="crosshair">+</div>
<div id="hitmarker">×</div>
<div id="hud">HEALTH: 100 | AMMO: 30</div>

<div id="joystick"><div id="stick"></div></div>
<button id="fire">FIRE</button>
<button id="aim">AIM</button>
<button id="reload">RELOAD</button>

<div id="gameover">
 <h1 id="resultTitle">MISSION FAILED</h1>
 <div id="finalscore"></div>
 <button id="restart">RESTART MISSION</button>
</div>
<div id="error"></div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

// SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87a9c4);
scene.fog=new THREE.Fog(0x87a9c4,55,140);

const camera=new THREE.PerspectiveCamera(
 75,innerWidth/innerHeight,.05,250
);
camera.position.set(0,1.7,8);
camera.rotation.order="YXZ";
camera.lookAt(0,1.7,-20);

const renderer=new THREE.WebGLRenderer({
 antialias:true,alpha:false
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setClearColor(0x87a9c4,1);
renderer.domElement.style.position="absolute";
renderer.domElement.style.inset="0";
renderer.domElement.style.zIndex="0";
document.body.insertBefore(
 renderer.domElement,document.body.firstChild
);

scene.add(new THREE.HemisphereLight(
 0xffffff,0x777777,2
));

function box(parent,w,h,d,color,x,y,z){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshBasicMaterial({color})
 );
 mesh.position.set(x,y,z);
 parent.add(mesh);
 return mesh;
}

// CITY
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshBasicMaterial({
  color:0x527044,side:THREE.DoubleSide
 })
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.02;
scene.add(ground);

const road=new THREE.Mesh(
 new THREE.PlaneGeometry(12,180),
 new THREE.MeshBasicMaterial({
  color:0x303238,side:THREE.DoubleSide
 })
);
road.rotation.x=-Math.PI/2;
road.position.y=.025;
scene.add(road);

box(scene,3,.2,180,0x999999,-7.5,.1,0);
box(scene,3,.2,180,0x999999,7.5,.1,0);

const colors=[
 0x885544,0x777777,0x554c48,0x99775b
];
for(let i=0;i<12;i++){
 const z=15-i*12;
 const h=7+(i%4)*2;
 box(scene,8,h,9,colors[i%4],-13,h/2,z);
 box(scene,8,h+2,9,
  colors[(i+1)%4],13,(h+2)/2,z);
}

for(let z=-75;z<75;z+=9){
 const line=new THREE.Mesh(
  new THREE.PlaneGeometry(.25,4),
  new THREE.MeshBasicMaterial({
   color:0xffd447,side:THREE.DoubleSide
  })
 );
 line.rotation.x=-Math.PI/2;
 line.position.set(0,.055,z);
 scene.add(line);
}

const crossRoad=new THREE.Mesh(
 new THREE.PlaneGeometry(80,10),
 new THREE.MeshBasicMaterial({
  color:0x303238,side:THREE.DoubleSide
 })
);
crossRoad.rotation.x=-Math.PI/2;
crossRoad.position.set(0,.04,-32);
scene.add(crossRoad);

// FIRST PERSON RIFLE
const gun=new THREE.Group();
camera.add(gun);
scene.add(camera);

const normalGunPosition=new THREE.Vector3(
 .28,-.18,-1.2
);
const aimedGunPosition=new THREE.Vector3(
 0,-.17,-1.05
);

gun.position.copy(normalGunPosition);
gun.scale.set(1.4,1.4,1.4);

box(gun,.22,.22,.65,0x30343a,0,0,0);
box(gun,.12,.12,.7,0x171b20,0,.09,-.45);
box(gun,.15,.25,.2,0x4d3b2e,0,-.2,.15);
box(gun,.1,.12,.18,0x111111,0,.2,-.15);

// IRON SIGHT
box(gun,.07,.13,.06,0x111111,0,.2,-.67);

// MUZZLE FLASH
const muzzleFlash=new THREE.Mesh(
 new THREE.SphereGeometry(.12,8,8),
 new THREE.MeshBasicMaterial({
  color:0xffcc00,
  transparent:true,
  opacity:.95,
  depthTest:false
 })
);
muzzleFlash.position.set(0,.1,-.85);
muzzleFlash.visible=false;
gun.add(muzzleFlash);
let flashTimer=0;

// CHECKPOINT
const checkpoint=new THREE.Group();
checkpoint.position.set(0,0,-55);
scene.add(checkpoint);

box(checkpoint,2,1.2,1,0x888888,-4,.6,0);
box(checkpoint,2,1.2,1,0x888888,4,.6,0);
box(checkpoint,1.5,3,1.5,0x4c5b42,-6,1.5,0);
box(checkpoint,1.5,3,1.5,0x4c5b42,6,1.5,0);
box(checkpoint,14,.5,.7,0x303030,0,4,0);

const marker=new THREE.Mesh(
 new THREE.CylinderGeometry(1.2,1.2,.12,32),
 new THREE.MeshBasicMaterial({color:0x00ff66})
);
marker.position.set(0,.15,-4);
checkpoint.add(marker);

// ENEMY HEALTH BARS
function createHealthBar(soldier){
 const group=new THREE.Group();
 group.position.set(0,3.1,0);

 const background=new THREE.Mesh(
  new THREE.PlaneGeometry(1.2,.16),
  new THREE.MeshBasicMaterial({
   color:0x333333,
   side:THREE.DoubleSide,
   depthTest:false
  })
 );

 const fill=new THREE.Mesh(
  new THREE.PlaneGeometry(1.1,.1),
  new THREE.MeshBasicMaterial({
   color:0x00ff00,
   side:THREE.DoubleSide,
   depthTest:false
  })
 );

 fill.position.z=.01;
 group.add(background,fill);
 soldier.add(group);

 soldier.userData.healthBar=group;
 soldier.userData.healthFill=fill;
}

function updateHealthBar(soldier){
 const data=soldier.userData;
 const fill=data.healthFill;
 if(!fill)return;

 const percent=Math.max(0,data.health/100);
 fill.scale.x=Math.max(.001,percent);
 fill.position.x=-(1.1*(1-percent))/2;

 fill.material.color.setHex(
  percent>.5?0x00ff00:
  percent>.25?0xffaa00:0xff0000
 );
}

// ENEMIES
const enemies=[];
const targets=[];

function createEnemy(x,z){
 const soldier=new THREE.Group();
 soldier.position.set(x,0,z);

 function part(w,h,d,c,px,py,pz){
  const mesh=box(soldier,w,h,d,c,px,py,pz);
  mesh.userData.enemy=soldier;
  targets.push(mesh);
 }

 part(.35,.8,.4,0x252a25,-.24,.4,0);
 part(.35,.8,.4,0x252a25,.24,.4,0);
 part(1,1.1,.55,0x42543b,0,1.35,0);
 part(.3,.9,.4,0x42543b,-.65,1.4,0);
 part(.3,.9,.4,0x42543b,.65,1.4,0);
 part(.55,.55,.5,0x9a7255,0,2.15,0);
 part(.75,.25,.7,0x303e2b,0,2.5,0);
 part(.45,.45,.04,0xff3333,0,1.4,.3);

 soldier.userData={
  health:100,
  alive:true,
  homeX:x,
  homeZ:z,
  phase:Math.random()*Math.PI*2,
  cooldown:2,
  respawn:0
 };

 createHealthBar(soldier);
 updateHealthBar(soldier);
 scene.add(soldier);
 enemies.push(soldier);
}

createEnemy(-3,-12);
createEnemy(3,-23);
createEnemy(-2,-35);
createEnemy(3,-48);
createEnemy(0,-62);

// JOYSTICK
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let moveX=0,moveY=0,joyId=null;

function updateStick(e){
 const r=joystick.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const d=Math.hypot(x,y);
 const max=37;

 if(d>max){
  x=x/d*max;
  y=y/d*max;
 }

 moveX=x/max;
 moveY=y/max;
 stick.style.transform=
  `translate(${x}px,${y}px)`;
}

joystick.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(joyId!==null)return;
 joyId=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 updateStick(e);
});

joystick.addEventListener("pointermove",e=>{
 if(e.pointerId===joyId)updateStick(e);
});

function stopStick(e){
 if(e.pointerId!==joyId)return;
 joyId=null;
 moveX=0;
 moveY=0;
 stick.style.transform="translate(0px,0px)";
}
joystick.addEventListener("pointerup",stopStick);
joystick.addEventListener("pointercancel",stopStick);

// TOUCH LOOK
let lookId=null,lastX=0,lastY=0;
let yaw=0,pitch=0;
let aiming=false;
let aimId=null;

renderer.domElement.addEventListener(
 "pointerdown",e=>{
  if(e.clientX<innerWidth*.35||
     lookId!==null)return;
  lookId=e.pointerId;
  lastX=e.clientX;
  lastY=e.clientY;
  renderer.domElement.setPointerCapture(
   e.pointerId
  );
 }
);

renderer.domElement.addEventListener(
 "pointermove",e=>{
  if(e.pointerId!==lookId)return;

  const sensitivity=aiming?.002:.004;
  yaw-=(e.clientX-lastX)*sensitivity;
  pitch-=(e.clientY-lastY)*sensitivity;

  pitch=Math.max(-1.2,Math.min(1.2,pitch));
  lastX=e.clientX;
  lastY=e.clientY;

  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
 }
);

function stopLook(e){
 if(e.pointerId===lookId)lookId=null;
}
renderer.domElement.addEventListener(
 "pointerup",stopLook
);
renderer.domElement.addEventListener(
 "pointercancel",stopLook
);

// STEP 9A - AIM DOWN SIGHTS
const aimButton=document.getElementById("aim");

function setAiming(value){
 if(gameEnded||missionComplete)value=false;
 aiming=value;
 aimButton.classList.toggle("active",aiming);
 aimButton.textContent=aiming?"AIMING":"AIM";
}

aimButton.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(aimId!==null)return;
 aimId=e.pointerId;
 aimButton.setPointerCapture(e.pointerId);
 setAiming(true);
});

function stopAim(e){
 if(e.pointerId!==aimId)return;
 aimId=null;
 setAiming(false);
}

aimButton.addEventListener("pointerup",stopAim);
aimButton.addEventListener("pointercancel",stopAim);
aimButton.addEventListener("lostpointercapture",stopAim);

// GAME STATE
let health=100;
let ammo=30;
let eliminations=0;
let gameEnded=false;
let missionComplete=false;
let damageFlash=0;
let recoil=0;

const hud=document.getElementById("hud");
const score=document.getElementById("score");
const missionDisplay=document.getElementById("mission");
const message=document.getElementById("message");

function updateHUD(){
 hud.textContent=`HEALTH: ${health} | AMMO: ${ammo}`;
 score.textContent=`ELIMINATIONS: ${eliminations}`;
}

let messageTimer;
function showMessage(text){
 message.textContent=text;
 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>{
  message.textContent="";
 },1000);
}

// HIT MARKERS
const hitmarker=document.getElementById("hitmarker");
let hitmarkerTimer;

function showHitmarker(eliminated=false){
 hitmarker.textContent="×";
 hitmarker.style.color=
  eliminated?"#ff3333":"#ffffff";
 hitmarker.style.display="block";

 clearTimeout(hitmarkerTimer);
 hitmarkerTimer=setTimeout(()=>{
  hitmarker.style.display="none";
 },180);
}

// BULLET IMPACTS
const impactEffects=[];

function createImpact(point){
 const impact=new THREE.Mesh(
  new THREE.SphereGeometry(.18,8,8),
  new THREE.MeshBasicMaterial({
   color:0xffcc33,
   transparent:true,
   opacity:1,
   depthTest:false
  })
 );

 impact.position.copy(point);
 scene.add(impact);

 impactEffects.push({
  mesh:impact,
  life:.25
 });
}

// SHOOTING
const raycaster=new THREE.Raycaster();
const center=new THREE.Vector2(0,0);

function shoot(){
 if(gameEnded||missionComplete)return;

 if(ammo<=0){
  showMessage("OUT OF AMMO - RELOAD");
  return;
 }

 ammo--;
 recoil=.12;
 flashTimer=.09;
 muzzleFlash.visible=true;
 updateHUD();

 camera.updateMatrixWorld(true);
 scene.updateMatrixWorld(true);

 raycaster.setFromCamera(center,camera);
 raycaster.far=100;

 const hits=raycaster.intersectObjects(
  targets,false
 );
 const hit=hits.find(h=>
  h.object.userData.enemy.userData.alive
 );

 if(hit){
  const soldier=hit.object.userData.enemy;
  soldier.userData.health-=50;
  updateHealthBar(soldier);

  createImpact(hit.point);
  showHitmarker(
   soldier.userData.health<=0
  );

  if(soldier.userData.health<=0){
   soldier.userData.alive=false;
   soldier.visible=false;
   soldier.userData.respawn=5;
   eliminations++;
   updateHUD();
   showMessage("ENEMY ELIMINATED!");
  }else{
   showMessage("ENEMY HIT!");
  }
 }else{
  showMessage("MISSED");
 }
}

document.getElementById("fire")
.addEventListener("pointerdown",e=>{
 e.preventDefault();
 shoot();
});

document.getElementById("reload")
.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(gameEnded||missionComplete)return;
 ammo=30;
 updateHUD();
 showMessage("RELOADED");
});

// DAMAGE
function takeDamage(amount){
 if(gameEnded||missionComplete)return;

 health=Math.max(0,health-amount);
 damageFlash=.5;
 updateHUD();
 showMessage("UNDER FIRE!");

 if(health<=0){
  gameEnded=true;
  moveX=0;
  moveY=0;
  setAiming(false);

  document.getElementById("resultTitle")
   .textContent="MISSION FAILED";
  document.getElementById("finalscore")
   .textContent="Eliminations: "+eliminations;
  document.getElementById("gameover")
   .style.display="flex";
 }
}

// MISSION
function updateMission(){
 if(missionComplete||gameEnded)return;

 if(eliminations<3){
  missionDisplay.textContent=
   `MISSION: ELIMINATE ${3-eliminations} MORE ENEMIES`;
  return;
 }

 missionDisplay.textContent=
  "MISSION: REACH GREEN CHECKPOINT";

 const target=new THREE.Vector3();
 marker.getWorldPosition(target);

 const distance=Math.hypot(
  camera.position.x-target.x,
  camera.position.z-target.z
 );

 if(distance<2.5){
  missionComplete=true;
  moveX=0;
  moveY=0;
  setAiming(false);

  missionDisplay.textContent="MISSION COMPLETE!";
  document.getElementById("resultTitle")
   .textContent="MISSION COMPLETE!";
  document.getElementById("finalscore")
   .textContent=
    "Operation Steel City | Eliminations: "+
    eliminations;
  document.getElementById("gameover")
   .style.display="flex";
 }
}

document.getElementById("restart")
.addEventListener("click",()=>location.reload());

// ANIMATION LOOP
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.05);

 // STEP 9A: SMOOTH AIM ZOOM
 const targetFOV=aiming?45:75;
 camera.fov=THREE.MathUtils.lerp(
  camera.fov,targetFOV,Math.min(1,dt*10)
 );
 camera.updateProjectionMatrix();

 const targetGun=aiming?
  aimedGunPosition:normalGunPosition;

 gun.position.lerp(
  targetGun,Math.min(1,dt*12)
 );

 if(!gameEnded&&!missionComplete){
  const speed=aiming?3.5:6;
  const forward=-moveY*speed*dt;
  const sideways=moveX*speed*dt;

  camera.position.x+=
   -Math.sin(yaw)*forward+
   Math.cos(yaw)*sideways;

  camera.position.z+=
   -Math.cos(yaw)*forward-
   Math.sin(yaw)*sideways;

  camera.position.x=Math.max(
   -8,Math.min(8,camera.position.x)
  );
  camera.position.z=Math.max(
   -75,Math.min(75,camera.position.z)
  );

  // SMART ENEMY AI
  for(const enemy of enemies){
   const data=enemy.userData;

   if(data.healthBar){
    data.healthBar.quaternion.copy(
     camera.quaternion
    );
   }

   if(!data.alive){
    data.respawn-=dt;

    if(data.respawn<=0){
     data.alive=true;
     data.health=100;
     enemy.visible=true;
     enemy.position.set(
      data.homeX,0,data.homeZ
     );
     data.cooldown=2;
     updateHealthBar(enemy);
    }
    continue;
   }

   data.phase+=dt;

   let dx=camera.position.x-enemy.position.x;
   let dz=camera.position.z-enemy.position.z;
   let distance=Math.hypot(dx,dz);

   const detectionRange=28;
   const attackRange=14;
   const chaseSpeed=2.2;
   const returnSpeed=1.2;

   if(distance<detectionRange){
    enemy.rotation.y=Math.atan2(dx,dz);

    if(distance>attackRange&&distance>.01){
     enemy.position.x+=
      (dx/distance)*chaseSpeed*dt;
     enemy.position.z+=
      (dz/distance)*chaseSpeed*dt;
    }
   }else{
    const homeDX=data.homeX-enemy.position.x;
    const homeDZ=data.homeZ-enemy.position.z;
    const homeDistance=Math.hypot(
     homeDX,homeDZ
    );

    if(homeDistance>1){
     enemy.position.x+=
      (homeDX/homeDistance)*returnSpeed*dt;
     enemy.position.z+=
      (homeDZ/homeDistance)*returnSpeed*dt;
    }else{
     enemy.position.x=
      data.homeX+
      Math.sin(data.phase)*1.5;
    }
   }

   dx=camera.position.x-enemy.position.x;
   dz=camera.position.z-enemy.position.z;
   distance=Math.hypot(dx,dz);

   data.cooldown-=dt;

   if(distance<attackRange&&
      data.cooldown<=0){
    data.cooldown=2.5;
    takeDamage(10);
   }
  }

  recoil=Math.max(0,recoil-dt*.5);
  flashTimer=Math.max(0,flashTimer-dt);
  muzzleFlash.visible=flashTimer>0;

  damageFlash=Math.max(0,damageFlash-dt);
  document.getElementById("damage")
   .style.opacity=damageFlash;

  updateMission();
 }

 // RIFLE RECOIL WHILE AIMING OR HIP-FIRING
 gun.position.z+=recoil;

 // UPDATE BULLET IMPACTS
 for(let i=impactEffects.length-1;i>=0;i--){
  const effect=impactEffects[i];

  effect.life-=dt;
  effect.mesh.material.opacity=
   Math.max(0,effect.life/.25);
  effect.mesh.scale.multiplyScalar(
   1+dt*3
  );

  if(effect.life<=0){
   scene.remove(effect.mesh);
   effect.mesh.geometry.dispose();
   effect.mesh.material.dispose();
   impactEffects.splice(i,1);
  }
 }

 renderer.render(scene,camera);
}

animate();

// SCREEN RESIZE
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

// ERROR DISPLAY
window.addEventListener("error",e=>{
 const el=document.getElementById("error");
 el.style.display="block";
 el.textContent="Game error: "+e.message;
});
</script>
</body>
</html>
