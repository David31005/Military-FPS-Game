
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pittsburgh Streets — Step 9N</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09131c;color:white;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px black}
#heading{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:0;right:0;text-align:center;font-weight:bold;font-size:18px}
#mission{font-size:11px;color:#aaffad;margin-top:3px}
#stats{position:absolute;top:calc(env(safe-area-inset-top) + 68px);left:8px;background:#071b25d9;padding:7px;border-radius:7px;font-size:12px;line-height:1.6}
#health{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 164px);left:9px;background:#071b25d9;padding:8px;border-radius:7px;font-size:12px}
#cross,#hit{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px}
#hit{font-size:35px;color:#ffdb44;opacity:0}
#scope{display:none;position:absolute;inset:0;background:radial-gradient(circle,transparent 0 26%,#000 27%);align-items:center;justify-content:center;font-size:32px}
#notice{position:absolute;top:30%;width:100%;text-align:center;color:#ffe66b;font-size:20px;font-weight:bold}
#damage{position:absolute;inset:0;background:red;opacity:0}
button{color:white;background:#29485e;border:2px solid #ffffff91;border-radius:10px;font-size:12px;font-weight:bold;padding:9px}
button:active{filter:brightness(1.4)}
#joy{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom) + 28px);width:124px;height:124px;border:3px solid #ffffff99;border-radius:50%;background:#ffffff20}
#knob{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:#ffffffbb}
#extras{position:fixed;top:calc(env(safe-area-inset-top) + 140px);left:8px;display:flex;flex-direction:column;gap:5px}
#guns{position:fixed;top:calc(env(safe-area-inset-top) + 140px);right:8px;display:flex;flex-direction:column;gap:5px}
#guns button.active{background:#27834b}
#actions{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 28px);display:grid;grid-template-columns:75px 90px;gap:7px}
#fire{grid-row:span 2;border-radius:50%;background:#b72c2c;font-size:19px}
#start,#finish{position:fixed;inset:0;z-index:20;background:#071520f2;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#finish{display:none}
#start p{line-height:1.5}
#start button,#finish button{font-size:18px;background:#26814c;padding:15px 25px}

/* IPHONE LANDSCAPE LAYOUT */
@media (orientation:landscape) and (max-height:600px){
#heading{top:calc(env(safe-area-inset-top) + 2px);font-size:clamp(12px,2.6vh,17px)}
#mission{font-size:10px;margin-top:1px}
#stats{top:calc(env(safe-area-inset-top) + 46px);left:calc(env(safe-area-inset-left) + 9px);font-size:10px;line-height:1.3;padding:5px 8px}
#health{top:calc(env(safe-area-inset-top) + 111px);bottom:auto;left:calc(env(safe-area-inset-left) + 9px);font-size:10px;padding:5px 8px}
#joy{left:calc(env(safe-area-inset-left) + 17px);bottom:calc(env(safe-area-inset-bottom) + 10px);width:clamp(75px,22vh,110px);height:clamp(75px,22vh,110px)}
#knob{width:40%;height:40%;left:30%;top:30%}
#extras{top:auto;bottom:calc(env(safe-area-inset-bottom) + 8px);left:calc(env(safe-area-inset-left) + clamp(105px,27vh,144px));flex-direction:column;gap:4px}
#extras button{font-size:10px;padding:6px 8px;min-height:29px}
#guns{top:calc(env(safe-area-inset-top) + 7px);right:calc(env(safe-area-inset-right) + 10px);flex-direction:row;gap:5px}
#guns button{font-size:10px;padding:7px 10px;min-width:55px}
#actions{right:calc(env(safe-area-inset-right) + 10px);bottom:calc(env(safe-area-inset-bottom) + 9px);grid-template-columns:clamp(54px,13vh,76px) clamp(72px,21vh,105px);gap:6px}
#actions button{font-size:11px;padding:6px}
#fire{font-size:17px!important}
#notice{top:25%;font-size:16px}
#cross{font-size:23px}
#start h1,#finish h1{font-size:23px}
#start p{font-size:13px;margin:8px 0}
#start button,#finish button{font-size:14px;padding:10px 18px}
}
@media (orientation:landscape) and (max-height:350px){
#heading{font-size:12px}
#mission{font-size:9px}
#stats{top:38px}
#health{top:99px}
#extras button{min-height:25px;padding:3px 6px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
<div id="damage"></div>
<div id="heading">PITTSBURGH STREETS<div id="mission">STEP 9N — LANDSCAPE FIX</div></div>
<div id="stats">KILLS: <span id="kills">0</span><br>ENEMIES: <span id="enemies">0</span><br>GRENADES: <span id="grenades">3</span></div>
<div id="health">HP: <span id="hp">100</span> | <span id="weapon">M4</span> <span id="ammo">30/180</span></div>
<div id="cross">+</div><div id="hit">×</div><div id="scope">+</div><div id="notice"></div>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="extras"><button id="grenade">GRENADE</button><button id="sound">SOUND ON</button><button id="test">TEST SOUND</button></div>
<div id="guns"><button data-gun="m4" class="active">M4</button><button data-gun="ak">AK-47</button><button data-gun="sniper">SNIPER</button></div>
<div id="actions"><button id="aim">AIM</button><button id="fire">FIRE</button><button id="reload">RELOAD</button></div>
<div id="start"><div><h1>PITTSBURGH STREETS</h1><p>STEP 9N — LANDSCAPE SUPPORT</p><p>Rotate your phone anytime. Three weapons, three waves, grenades, and checkpoint.</p><button id="play">START MISSION</button></div></div>
<div id="finish"><div><h1 id="result"></h1><p id="score"></p><button id="restart">PLAY AGAIN</button></div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";
const $=id=>document.getElementById(id);
let scene,camera,renderer,gunScene,gunCamera,clock,gunGroup,muzzlePoint;
let soldiers=[],items=[],effects=[],checkpoint=null;
let player={x:0,z:15,hp:100},yaw=0,pitch=0,wave=0,kills=0,grenades=3;
let playing=false,aiming=false,firing=false,soundOn=true,audioContext;
let current="m4",lastShot=0,reloadEnd=0,reloadStart=0,reloadDuration=0;
let recoil=0,walkTime=0,session=0,wavePending=false;
let joy={x:0,y:0},keys={},guns={};
const specs={
m4:{name:"M4",size:30,rate:115,damage:36,range:100,spread:.018},
ak:{name:"AK-47",size:30,rate:155,damage:44,range:95,spread:.027},
sniper:{name:"SNIPER",size:5,rate:1000,damage:125,range:180,spread:.003}
};
const mat=c=>new THREE.MeshLambertMaterial({color:c});
function cube(w,h,d,c,x,y,z,parent=scene){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));
m.position.set(x,y,z);parent.add(m);return m;
}
function ball(r,c,x,y,z,parent=scene){
const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat(c));
m.position.set(x,y,z);parent.add(m);return m;
}
function tone(f=160,d=.12,v=.06){
if(!soundOn)return;
try{
audioContext??=new(window.AudioContext||window.webkitAudioContext)();
audioContext.resume();
const o=audioContext.createOscillator(),g=audioContext.createGain();
o.type="sawtooth";o.frequency.setValueAtTime(f,audioContext.currentTime);
o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.5),audioContext.currentTime+d);
g.gain.setValueAtTime(v,audioContext.currentTime);
g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+d);
o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+d);
}catch(e){}
}
function message(s){
$("notice").textContent=s;clearTimeout(message.timer);
message.timer=setTimeout(()=>$("notice").textContent="",1400);
}
function resizeGame(){
const w=document.documentElement.clientWidth,h=document.documentElement.clientHeight;
camera.aspect=w/h;camera.updateProjectionMatrix();
gunCamera.aspect=w/h;gunCamera.updateProjectionMatrix();
renderer.setSize(w,h,false);
renderer.domElement.style.width=w+"px";
renderer.domElement.style.height=h+"px";
}
function setup(){
scene=new THREE.Scene();
scene.background=new THREE.Color(0x91abc4);
scene.fog=new THREE.Fog(0x91abc4,55,145);
camera=new THREE.PerspectiveCamera(74,1,.1,220);
camera.rotation.order="YXZ";scene.add(camera);
renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.autoClear=false;
$("game").appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x5b584f,2));
const sun=new THREE.DirectionalLight(0xffd6a0,1.5);
sun.position.set(-25,45,20);scene.add(sun);
buildCity();
gunScene=new THREE.Scene();
gunScene.add(new THREE.HemisphereLight(0xffffff,0x888888,3));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(-2,5,5);gunScene.add(light);
gunCamera=new THREE.PerspectiveCamera(55,1,.01,20);
gunCamera.position.set(0,0,0);gunCamera.lookAt(0,0,-1);
clock=new THREE.Clock();
buildGun();resizeGame();
window.addEventListener("resize",resizeGame);
window.addEventListener("orientationchange",()=>{
setTimeout(resizeGame,150);setTimeout(resizeGame,500);
});
animate();
}
function buildCity(){
cube(180,.2,220,0x566a50,0,-.2,-30);
cube(19,.08,190,0x33383d,0,0,-30);
for(const side of [-1,1])cube(3,.12,190,0x8d8e89,side*11,.04,-30);
for(let z=-115;z<65;z+=9)cube(.25,.02,3.5,0xecc35d,0,.08,z);
const colors=[0x946b55,0x8c8580,0x687782,0x987f65,0x646b73];
for(let z=-110,i=0;z<70;z+=14,i++){
for(const side of [-1,1]){
const h=12+(i*7)%20,x=side*18;
cube(11,h,12,colors[i%colors.length],x,h/2,z);
cube(11.4,.45,12.4,0x44484b,x,h+.2,z);
for(let y=3;y<h-1;y+=4){
for(let dz=-4;dz<=4;dz+=4){
cube(.15,2,1.8,0x253d54,side*12.4,y,z+dz);
}
}
}
}
for(let z=-100;z<55;z+=28){
for(const side of [-1,1]){
cube(.22,9,.22,0x3b4247,side*10.5,4.5,z);
cube(1,.45,.8,0xf0db9d,side*10.5,9,z);
}
}
for(let z=-95,i=0;z<40;z+=27,i++){
const x=i%2===0?7.5:-7.5;
const color=[0x283e56,0x713d34,0x343638,0x8c8e8b][i%4];
cube(2.2,.85,4.2,color,x,.75,z);
cube(1.9,.75,2.2,color,x,1.5,z-.25);
cube(1.75,.42,.06,0x293e50,x,1.6,z-1.37);
for(const dx of [-1,1])for(const dz of [-1.4,1.4]){
const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.2,12),mat(0x141719));
wheel.rotation.z=Math.PI/2;wheel.position.set(x+dx*1.12,.45,z+dz);scene.add(wheel);
}
}
for(const z of [-45,-82]){
cube(3.5,1.1,.65,0x8b8068,-4,.55,z);
cube(3.5,.15,.7,0xe4b33b,-4,1.15,z);
}
}
function buildGun(){
if(gunGroup)gunScene.remove(gunGroup);
gunGroup=new THREE.Group();
const ak=current==="ak",sniper=current==="sniper";
const body=ak?0x80522d:0x354047,steel=0x11181d;
const barrel=sniper?1.4:1.05;
cube(.29,.26,.72,body,0,-.04,-.65,gunGroup);
cube(.24,.13,.58,steel,0,.13,-.72,gunGroup);
cube(.11,.11,barrel,steel,0,.04,-1.14,gunGroup);
cube(.16,.15,.18,0x080b0e,0,.04,-1.14-barrel/2,gunGroup);
cube(.28,.22,.6,ak?0x9a663b:0x46535a,0,.02,-1.1,gunGroup);
cube(.16,.05,.85,0x11171a,0,.2,-.85,gunGroup);
cube(.23,.23,.46,ak?0x86512b:0x293338,0,-.04,-.2,gunGroup);
cube(.16,.36,.18,0x202326,0,-.3,-.5,gunGroup);
const magazine=cube(.2,.44,.22,ak?0x42362a:0x20262b,0,-.39,-.81,gunGroup);
magazine.rotation.x=ak?-.23:.08;
for(const z of [-1.35,-.47])cube(.1,.15,.09,steel,0,.27,z,gunGroup);
if(sniper){
cube(.2,.2,.67,0x12171b,0,.36,-.76,gunGroup);
cube(.31,.28,.12,0x090b0d,0,.36,-1.12,gunGroup);
cube(.24,.23,.12,0x090b0d,0,.36,-.43,gunGroup);
}
cube(.27,.25,.4,0x966b4b,.21,-.28,-.46,gunGroup);
cube(.35,.35,.59,0x344b40,.32,-.55,-.27,gunGroup);
cube(.27,.25,.39,0x966b4b,-.21,-.16,-1.1,gunGroup);
cube(.35,.35,.63,0x344b40,-.32,-.4,-1,gunGroup);
muzzlePoint=new THREE.Object3D();
muzzlePoint.position.set(0,.04,-1.14-barrel/2-.13);
gunGroup.add(muzzlePoint);
gunGroup.position.set(.19,-.2,-.14);
gunGroup.scale.setScalar(.9);
gunScene.add(gunGroup);
}
function makeSoldier(x,z,commander=false){
const group=new THREE.Group(),c=commander?0x654044:0x4a5a45;
cube(.82,1.12,.53,c,0,1.4,0,group);
cube(.73,.3,.62,0x313b32,0,2,0,group);
ball(.31,0xae8061,0,2.23,0,group);
cube(.73,.18,.67,0x303c32,0,2.48,0,group);
for(const side of [-1,1]){
cube(.25,.9,.3,c,side*.26,.5,0,group);
cube(.24,.75,.3,c,side*.54,1.45,0,group);
}
cube(.16,.16,.86,0x202428,0,1.55,.5,group);
const bar=cube(1,.1,.1,0x42f060,0,2.85,0,group);
group.position.set(x,0,z);scene.add(group);
const hp=commander?280:100;
return {group,x,z,hp,max:hp,bar,commander,dead:false,fire:Math.random()*2,mag:commander?18:10,reload:0,strafe:Math.random()<.5?-1:1,move:0};
}
function spawnWave(){
wavePending=false;wave++;
const count=wave===1?3:wave===2?5:7;
for(let i=0;i<count;i++){
const x=(i%4-1.5)*4.3;
const z=Math.max(-106,player.z-25-Math.floor(i/4)*12-Math.random()*6);
soldiers.push(makeSoldier(x,z,wave>1&&i===count-1));
}
$("mission").textContent="WAVE "+wave+" / 3 — ELIMINATE ENEMIES";
message("WAVE "+wave+" INCOMING");updateHUD();
}
function updateHUD(){
$("kills").textContent=kills;
$("enemies").textContent=soldiers.filter(e=>!e.dead).length;
$("grenades").textContent=grenades;
$("hp").textContent=Math.ceil(player.hp);
$("weapon").textContent=specs[current].name;
$("ammo").textContent=guns[current].mag+"/"+guns[current].reserve;
}
function setAim(v){
aiming=v;camera.fov=aiming?(current==="sniper"?23:54):74;
camera.updateProjectionMatrix();
$("scope").style.display=aiming&&current==="sniper"?"flex":"none";
$("cross").style.display=aiming&&current==="sniper"?"none":"block";
}
function switchGun(name){
if(!playing)return;
current=name;reloadEnd=0;setAim(false);buildGun();
document.querySelectorAll("#guns button").forEach(b=>b.classList.toggle("active",b.dataset.gun===name));
tone(360,.08);updateHUD();
}
function reload(){
if(!playing||reloadEnd)return;
const g=guns[current],s=specs[current];
if(g.mag>=s.size||g.reserve<=0)return;
reloadDuration=current==="sniper"?1900:1450;
reloadStart=performance.now();reloadEnd=reloadStart+reloadDuration;
message("RELOADING");tone(400,.15);
}
function effect(mesh,duration,update){
effects.push({mesh,start:performance.now(),duration,update});
}
function tracer(start,end,color=0xffee55,duration=230){
const d=new THREE.Vector3().subVectors(end,start),length=d.length();
if(length<.02)return;
const mesh=new THREE.Mesh(
new THREE.CylinderGeometry(.035,.06,length,6),
new THREE.MeshBasicMaterial({color,transparent:true,opacity:1,depthTest:false,depthWrite:false})
);
mesh.position.copy(start).add(end).multiplyScalar(.5);
mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
mesh.renderOrder=5;scene.add(mesh);
effect(mesh,duration,t=>{mesh.material.opacity=1-t;return t<1;});
}
function flash(pos,color=0xffbb22){
const mesh=new THREE.Mesh(
new THREE.SphereGeometry(.25,8,6),
new THREE.MeshBasicMaterial({color,transparent:true,opacity:1,depthTest:false})
);
mesh.position.copy(pos);mesh.renderOrder=6;scene.add(mesh);
effect(mesh,100,t=>{
mesh.scale.setScalar(1+t*2);mesh.material.opacity=1-t;return t<1;
});
}
function sparks(pos){
for(let i=0;i<5;i++){
const mesh=new THREE.Mesh(
new THREE.SphereGeometry(.05,6,4),
new THREE.MeshBasicMaterial({color:0xffc84b,transparent:true,opacity:1})
);
mesh.position.copy(pos);scene.add(mesh);
const velocity=new THREE.Vector3((Math.random()-.5)*4,Math.random()*3,(Math.random()-.5)*4);
effect(mesh,280,t=>{
mesh.position.copy(pos).addScaledVector(velocity,t);
mesh.material.opacity=1-t;return t<1;
});
}
}
function hitMarker(head){
$("hit").style.color=head?"#ff4040":"#ffe16a";
$("hit").style.opacity=1;
clearTimeout(hitMarker.timer);
hitMarker.timer=setTimeout(()=>$("hit").style.opacity=0,120);
}
function damageEnemy(e,amount,head=false){
if(e.dead)return;
e.hp-=amount;e.bar.scale.x=Math.max(0,e.hp/e.max);
hitMarker(head);if(head)message("HEADSHOT!");
if(e.hp<=0){
e.dead=true;scene.remove(e.group);kills++;
if(kills%3===0)dropItem(e.x,e.z,Math.random()<.5?"health":"ammo");
if(soldiers.every(s=>s.dead)&&!wavePending){
wavePending=true;
if(wave<3){
const token=session;
setTimeout(()=>{if(playing&&session===token)spawnWave();},1600);
}else makeCheckpoint();
}
}
updateHUD();
}
function fire(){
if(!playing||reloadEnd)return;
const now=performance.now(),s=specs[current],g=guns[current];
if(now-lastShot<s.rate)return;lastShot=now;
if(g.mag<=0){tone(100,.06);reload();return;}
g.mag--;recoil=.17;
tone(current==="sniper"?90:current==="ak"?125:165,current==="sniper"?.26:.12,.1);
const dir=new THREE.Vector3();camera.getWorldDirection(dir);
const spread=s.spread*(aiming?.3:1);
dir.x+=(Math.random()-.5)*spread;
dir.y+=(Math.random()-.5)*spread;
dir.normalize();
const ray=new THREE.Ray(camera.position.clone(),dir);
let target=null,closest=s.range,head=false;
for(const e of soldiers){
if(e.dead)continue;
const center=new THREE.Vector3(e.x,1.5,e.z);
const t=center.sub(camera.position).dot(dir);
if(t<=0||t>=closest)continue;
const point=ray.at(t,new THREE.Vector3());
if(Math.abs(point.x-e.x)<.57&&Math.abs(point.z-e.z)<.7&&point.y>.3&&point.y<2.6){
closest=t;target=e;head=point.y>1.95;
}
}
const start=camera.position.clone().addScaledVector(dir,1.1);
start.y-=.13;
const end=camera.position.clone().addScaledVector(dir,target?closest:Math.min(s.range,65));
tracer(start,end,current==="sniper"?0xff9222:0xffee55,current==="sniper"?330:230);
flash(start);
if(target){damageEnemy(target,s.damage*(head?2.3:1),head);sparks(end);}
updateHUD();
}
function dropItem(x,z,type){
const group=new THREE.Group();
cube(.8,.35,.8,type==="health"?0x27e85d:0xe3b937,0,.4,0,group);
if(type==="health"){
cube(.15,.04,.5,0xffffff,0,.63,0,group);
cube(.5,.04,.15,0xffffff,0,.64,0,group);
}
group.position.set(x,0,z);scene.add(group);items.push({group,x,z,type});
}
function grenadeThrow(){
if(!playing||grenades<=0)return;
grenades--;updateHUD();tone(260,.12);
const dir=new THREE.Vector3();camera.getWorldDirection(dir);
const sx=player.x,sz=player.z;
const tx=Math.max(-8,Math.min(8,sx+dir.x*12));
const tz=Math.max(-107,Math.min(55,sz+dir.z*12));
const orb=ball(.28,0x38523b,sx,1.5,sz);
effect(orb,700,t=>{
orb.position.set(sx+(tx-sx)*t,1.5+3*Math.sin(Math.PI*t),sz+(tz-sz)*t);
if(t>=1){explode(tx,tz);return false;}return true;
});
}
function explode(x,z){
tone(65,.45,.18);
const mesh=new THREE.Mesh(
new THREE.SphereGeometry(2.2,12,8),
new THREE.MeshBasicMaterial({color:0xffa42c,transparent:true,opacity:1})
);
mesh.position.set(x,1,z);scene.add(mesh);
effect(mesh,350,t=>{
mesh.scale.setScalar(1+t*1.7);mesh.material.opacity=1-t;return t<1;
});
for(const e of soldiers){
if(e.dead)continue;
const d=Math.hypot(e.x-x,e.z-z);
if(d<7)damageEnemy(e,Math.max(50,170-d*18));
}
}
function makeCheckpoint(){
if(checkpoint)return;
checkpoint=new THREE.Group();
const base=new THREE.Mesh(
new THREE.CylinderGeometry(2.2,2.2,.1,20),
new THREE.MeshBasicMaterial({color:0x32ff77})
);
base.position.y=.12;checkpoint.add(base);
const beam=new THREE.Mesh(
new THREE.CylinderGeometry(1.4,1.4,7,16,1,true),
new THREE.MeshBasicMaterial({color:0x36ff80,transparent:true,opacity:.2,side:THREE.DoubleSide})
);
beam.position.y=3.5;checkpoint.add(beam);
checkpoint.position.set(0,0,Math.max(-105,player.z-13));
scene.add(checkpoint);
$("mission").textContent="REACH THE GREEN CHECKPOINT";
message("ALL WAVES CLEARED!");
}
function endGame(win){
playing=false;firing=false;$("finish").style.display="flex";
$("result").textContent=win?"MISSION COMPLETE":"MISSION FAILED";
$("score").textContent="TOTAL ELIMINATIONS: "+kills;
}
function reset(){
session++;
soldiers.forEach(e=>scene.remove(e.group));
items.forEach(e=>scene.remove(e.group));
effects.forEach(e=>scene.remove(e.mesh));
if(checkpoint)scene.remove(checkpoint);
soldiers=[];items=[];effects=[];checkpoint=null;wavePending=false;
player={x:0,z:15,hp:100};yaw=0;pitch=0;wave=0;kills=0;grenades=3;
current="m4";lastShot=0;reloadEnd=0;recoil=0;walkTime=0;
guns={
m4:{mag:30,reserve:180},
ak:{mag:30,reserve:150},
sniper:{mag:5,reserve:30}
};
setAim(false);buildGun();playing=true;firing=false;
$("start").style.display="none";$("finish").style.display="none";
document.querySelectorAll("#guns button").forEach(b=>b.classList.toggle("active",b.dataset.gun==="m4"));
spawnWave();updateHUD();
}
function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.05),now=performance.now();
if(playing){
if(reloadEnd&&now>=reloadEnd){
const g=guns[current],s=specs[current];
const amount=Math.min(s.size-g.mag,g.reserve);
g.mag+=amount;g.reserve-=amount;reloadEnd=0;
tone(520,.1);updateHUD();
}
if(firing)fire();
let mx=joy.x+(keys.KeyD?1:0)-(keys.KeyA?1:0);
let my=-joy.y+(keys.KeyW?1:0)-(keys.KeyS?1:0);
const len=Math.max(1,Math.hypot(mx,my));mx/=len;my/=len;
const speed=aiming?3.2:6.2;
player.x+=(Math.cos(yaw)*mx-Math.sin(yaw)*my)*speed*dt;
player.z+=(-Math.sin(yaw)*mx-Math.cos(yaw)*my)*speed*dt;
player.x=Math.max(-8.5,Math.min(8.5,player.x));
player.z=Math.max(-108,Math.min(57,player.z));
camera.position.set(player.x,1.75,player.z);
camera.rotation.set(pitch,yaw,0);
recoil=Math.max(0,recoil-dt*.9);
const moving=Math.hypot(mx,my)>.1;
if(moving)walkTime+=dt*10;
const bob=moving?Math.sin(walkTime)*.018:0;
const progress=reloadEnd?Math.max(0,Math.min(1,(now-reloadStart)/reloadDuration)):0;
const dip=reloadEnd?Math.sin(progress*Math.PI)*.3:0;
if(gunGroup){
const landscape=innerWidth>innerHeight;
gunGroup.position.set(
aiming?.04:landscape?.15:.19,
(aiming?-.13:landscape?-.29:-.2)+bob-dip-recoil*.3,
landscape?-.25:-.14
);
gunGroup.rotation.x=recoil*.6+dip*.7;
gunGroup.rotation.y=aiming?0:-.08;
gunGroup.scale.setScalar(landscape?.78:.9);
gunGroup.visible=!(aiming&&current==="sniper");
}
for(const e of soldiers){
if(e.dead)continue;
const dx=player.x-e.x,dz=player.z-e.z;
const dist=Math.max(.01,Math.hypot(dx,dz));
e.group.rotation.y=Math.atan2(dx,dz);
if(dist>11&&dist<65){
const step=(e.commander?1.7:1.3)*dt;
e.x+=dx/dist*step;e.z+=dz/dist*step;
}else if(dist<5){
e.x-=dx/dist*2*dt;e.z-=dz/dist*2*dt;
}
e.move+=dt;
if(e.move>1.8){e.move=0;e.strafe*=-1;}
e.x+=e.strafe*dt*.55;
e.x=Math.max(-8,Math.min(8,e.x));
e.group.position.set(e.x,0,e.z);
if(e.reload>0){e.reload-=dt;continue;}
e.fire-=dt;
if(dist<45&&e.fire<=0){
e.fire=(e.commander?.65:1.2)+Math.random()*.6;
e.mag--;tone(85,.08,.012);
const start=new THREE.Vector3(e.x,1.5,e.z);
const end=camera.position.clone();
end.x+=(Math.random()-.5)*1.8;
end.y+=(Math.random()-.5)*1.1;
tracer(start,end,0xff3030,250);flash(start,0xff5522);
if(e.mag<=0){e.reload=2.2;e.mag=e.commander?18:10;}
if(Math.random()<Math.max(.08,.65-dist*.012)){
player.hp-=e.commander?9:6;
$("damage").style.opacity=.25;
setTimeout(()=>$("damage").style.opacity=0,110);
if(player.hp<=0){player.hp=0;endGame(false);}
}
updateHUD();
}
}
for(let i=items.length-1;i>=0;i--){
const p=items[i];p.group.rotation.y+=dt*2;
if(Math.hypot(p.x-player.x,p.z-player.z)<1.7){
if(p.type==="health"){
player.hp=Math.min(100,player.hp+35);message("HEALTH +35");
}else{
guns.m4.reserve+=45;guns.ak.reserve+=45;guns.sniper.reserve+=8;
message("AMMO RESTOCKED");
}
scene.remove(p.group);items.splice(i,1);updateHUD();
}
}
if(checkpoint&&Math.hypot(checkpoint.position.x-player.x,checkpoint.position.z-player.z)<2.4)endGame(true);
}
for(let i=effects.length-1;i>=0;i--){
const e=effects[i],t=Math.min(1,(now-e.start)/e.duration);
if(!e.update(t)){
scene.remove(e.mesh);
e.mesh.geometry?.dispose();e.mesh.material?.dispose();
effects.splice(i,1);
}
}
renderer.clear();renderer.render(scene,camera);
renderer.clearDepth();renderer.render(gunScene,gunCamera);
}

/* TOUCH CONTROLS */
const stick=$("joy");let stickId=null;
function moveStick(e){
const r=stick.getBoundingClientRect();
const dx=e.clientX-r.left-r.width/2;
const dy=e.clientY-r.top-r.height/2;
const limit=r.width*.32,len=Math.max(1,Math.hypot(dx,dy));
joy.x=Math.max(-1,Math.min(1,dx/limit));
joy.y=Math.max(-1,Math.min(1,dy/limit));
const factor=Math.min(limit,len)/len;
$("knob").style.transform=`translate(${dx*factor}px,${dy*factor}px)`;
}
stick.addEventListener("pointerdown",e=>{
e.preventDefault();stickId=e.pointerId;
stick.setPointerCapture(e.pointerId);moveStick(e);
});
stick.addEventListener("pointermove",e=>{
if(e.pointerId===stickId)moveStick(e);
});
function stopStick(e){
if(e.pointerId!==stickId)return;
stickId=null;joy={x:0,y:0};$("knob").style.transform="";
}
stick.addEventListener("pointerup",stopStick);
stick.addEventListener("pointercancel",stopStick);
let lookId=null,lookX=0,lookY=0;
window.addEventListener("pointerdown",e=>{
if(e.target!==renderer.domElement)return;
lookId=e.pointerId;lookX=e.clientX;lookY=e.clientY;
});
window.addEventListener("pointermove",e=>{
if(e.pointerId!==lookId||!playing)return;
yaw-=(e.clientX-lookX)*.004;
pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-lookY)*.0035));
lookX=e.clientX;lookY=e.clientY;
});
window.addEventListener("pointerup",e=>{
if(e.pointerId===lookId)lookId=null;
});
window.addEventListener("pointercancel",e=>{
if(e.pointerId===lookId)lookId=null;
});
function control(id,down,up=()=>{}){
const el=$(id);
el.addEventListener("pointerdown",e=>{
e.preventDefault();el.setPointerCapture(e.pointerId);down();
});
el.addEventListener("pointerup",up);
el.addEventListener("pointercancel",up);
}
control("fire",()=>{firing=true;fire();},()=>firing=false);
control("aim",()=>setAim(!aiming));
control("reload",reload);
control("grenade",grenadeThrow);
document.querySelectorAll("#guns button").forEach(b=>
b.addEventListener("click",()=>switchGun(b.dataset.gun)));
$("sound").onclick=()=>{
soundOn=!soundOn;
$("sound").textContent=soundOn?"SOUND ON":"SOUND OFF";
};
$("test").onclick=()=>tone(600,.25,.12);
$("play").onclick=reset;
$("restart").onclick=reset;
window.addEventListener("keydown",e=>{
keys[e.code]=true;
if(e.code==="Space")fire();
if(e.code==="KeyR")reload();
if(e.code==="KeyG")grenadeThrow();
if(e.code==="Digit1")switchGun("m4");
if(e.code==="Digit2")switchGun("ak");
if(e.code==="Digit3")switchGun("sniper");
});
window.addEventListener("keyup",e=>keys[e.code]=false);
document.addEventListener("contextmenu",e=>e.preventDefault());
setup();
</script>
