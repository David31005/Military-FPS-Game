
<!DOCTYPE html>

<title>Pittsburgh Streets 9F</title>
<style>
*{box-sizing:border-box}

#restart{background:#c62828;border:2px solid white;padding:15px 25px;border-radius:12px;font-size:18px}
#error{display:none;position:absolute;z-index:20;top:270px;left:10px;right:10px;background:#a00000;color:white;padding:12px}

<body>
<div id="damage"></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x89abc4);
scene.fog=new THREE.Fog(0x89abc4,55,145);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,250);
camera.position.set(0,1.7,8);
camera.rotation.order="YXZ";
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.domElement.style.cssText="position:absolute;inset:0;z-index:0";
document.body.insertBefore(renderer.domElement,document.body.firstChild);
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));

function box(parent,w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color}));
 m.position.set(x,y,z);parent.add(m);return m;
}
function floor(w,d,color,x,z,y=0){
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide}));
 m.rotation.x=-Math.PI/2;m.position.set(x,y,z);scene.add(m);return m;
}
floor(200,200,0x527044,0,0,-.02);
floor(12,180,0x303238,0,0,.025);
box(scene,3,.2,180,0x999999,-7.5,.1,0);
box(scene,3,.2,180,0x999999,7.5,.1,0);
const colors=[0x885544,0x777777,0x554c48,0x99775b];
for(let i=0;i<12;i++){
 const z=15-i*12,h=7+(i%4)*2;
 box(scene,8,h,9,colors[i%4],-13,h/2,z);
 box(scene,8,h+2,9,colors[(i+1)%4],13,(h+2)/2,z);
}
for(let z=-75;z<75;z+=9)floor(.25,4,0xffd447,0,z,.055);
floor(80,10,0x303238,0,-32,.04);

// COLLISION AND MILITARY OBJECTS
const obstacles=[],solids=[],barriers=[];
function solid(m){solids.push(m);return m;}
function obstacle(x,z,w,d){obstacles.push({x,z,w,d});}
function collides(x,z,r=.35){
 return obstacles.some(o=>Math.abs(x-o.x)<o.w/2+r&&Math.abs(z-o.z)<o.d/2+r);
}
function barrier(x,z){
 solid(box(scene,2.3,1.25,.85,0x999b9b,x,.625,z));
 solid(box(scene,2.38,.14,.95,0xc1c3c3,x,1.3,z));
 obstacle(x,z,2.3,.85);barriers.push({x,z});
}
[[-3.9,-15],[3.9,-26],[-3.9,-38],[3.9,-50],[-3.9,-64]].forEach(p=>barrier(...p));

function wheel(g,x,y,z){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.24,12),new THREE.MeshBasicMaterial({color:0x151515}));
 m.rotation.z=Math.PI/2;m.position.set(x,y,z);g.add(m);solid(m);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.26,12),new THREE.MeshBasicMaterial({color:0x555555}));
 hub.rotation.z=Math.PI/2;hub.position.set(x,y,z);g.add(hub);
}
function vehicle(x,z,truck=false){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 if(truck){
  solid(box(g,2.4,.65,6.5,0x252525,0,.9,0));
  solid(box(g,2.3,1.55,2,0x536247,0,1.75,-2.15));
  solid(box(g,2.35,1.65,3.8,0x6c7056,0,1.95,1.2));
  box(g,2.05,.55,.08,0x273f43,0,2.05,-3.18);
  for(const s of [-1,1])for(const wz of [-2.25,.6,2.15])wheel(g,s*1.23,.52,wz);
  obstacle(x,z,2.8,6.8);
 }else{
  solid(box(g,2.2,.85,4.1,0x48583a,0,1.05,0));
  solid(box(g,2.05,.8,2.15,0x48583a,0,1.82,.25));
  box(g,1.85,.42,.08,0x25302b,0,1.92,-.88);
  box(g,2.25,.28,.25,0x333333,0,.72,-2.1);
  box(g,.85,.24,.85,0x303b2d,0,2.38,.25);
  box(g,.17,.16,1.2,0x151515,0,2.42,-.65);
  for(const s of [-1,1])for(const wz of [-1.35,1.35])wheel(g,s*1.12,.5,wz);
  obstacle(x,z,2.5,4.4);
 }
}
vehicle(-3.9,-20);
vehicle(3.8,-42);
vehicle(3.6,-60,true);
vehicle(-3.8,-72,true);
function roadblock(x,z){
 solid(box(scene,2.2,.85,.55,0xb0a99b,x,.425,z));
 solid(box(scene,2.25,.16,.62,0xf5c242,x,.9,z));
 obstacle(x,z,2.2,.55);
}
roadblock(-2.5,-30);
roadblock(2.5,-34);
roadblock(0,-68);

// PLAYER RIFLE
scene.add(camera);
const gun=new THREE.Group();camera.add(gun);
const gunNormal=new THREE.Vector3(.28,-.18,-1.2);
const gunAim=new THREE.Vector3(0,-.17,-1.05);
const gunBase=gunNormal.clone();
gun.scale.setScalar(1.4);
box(gun,.22,.22,.65,0x30343a,0,0,0);
box(gun,.12,.12,.7,0x171b20,0,.09,-.45);
box(gun,.15,.25,.2,0x4d3b2e,0,-.2,.15);
box(gun,.1,.12,.18,0x111111,0,.2,-.15);
const playerFlash=new THREE.Mesh(new THREE.SphereGeometry(.2,10,8),new THREE.MeshBasicMaterial({color:0xffdd33,depthTest:false}));
playerFlash.position.set(0,.1,-.85);
playerFlash.visible=false;gun.add(playerFlash);

// CHECKPOINT
const checkpoint=new THREE.Group();
checkpoint.position.set(0,0,-55);scene.add(checkpoint);
box(checkpoint,2,1.2,1,0x888888,-4,.6,0);
box(checkpoint,2,1.2,1,0x888888,4,.6,0);
box(checkpoint,1.5,3,1.5,0x4c5b42,-6,1.5,0);
box(checkpoint,1.5,3,1.5,0x4c5b42,6,1.5,0);
box(checkpoint,14,.5,.7,0x303030,0,4,0);
const marker=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,.12,32),new THREE.MeshBasicMaterial({color:0x00ff66}));
marker.position.set(0,.15,-4);checkpoint.add(marker);

// SQUADS AND SOLDIERS
const enemies=[],targets=[];
const squads=[
 {name:"ALPHA",members:[],alert:0},
 {name:"BRAVO",members:[],alert:0}
];
function labelFor(e){
 const canvas=document.createElement("canvas");canvas.width=256;canvas.height=64;
 const texture=new THREE.CanvasTexture(canvas);
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true,depthTest:false}));
 sprite.position.y=3.65;sprite.scale.set(1.9,.48,1);e.add(sprite);
 return {canvas,texture};
}
function status(e,text){
 const d=e.userData;
 if(d.status===text)return;
 d.status=text;
 const ctx=d.label.canvas.getContext("2d");
 ctx.clearRect(0,0,256,64);
 ctx.fillStyle="#000b";ctx.fillRect(0,7,256,49);
 ctx.fillStyle=text==="RELOADING"?"#ffcc33":"white";
 ctx.font="bold 27px Arial";ctx.textAlign="center";
 ctx.fillText(text,128,42);
 d.label.texture.needsUpdate=true;
}
function healthBar(e){
 const g=new THREE.Group();g.position.y=3.1;
 const bg=new THREE.Mesh(new THREE.PlaneGeometry(1.2,.16),new THREE.MeshBasicMaterial({color:0x333333,side:THREE.DoubleSide,depthTest:false}));
 const fill=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.1),new THREE.MeshBasicMaterial({color:0x00ff00,side:THREE.DoubleSide,depthTest:false}));
 fill.position.z=.01;g.add(bg,fill);e.add(g);
 return {g,fill};
}
function updateBar(e){
 const d=e.userData,p=Math.max(0,d.hp/100);
 d.bar.fill.scale.x=Math.max(.001,p);
 d.bar.fill.position.x=-.55*(1-p);
 d.bar.fill.material.color.setHex(p>.5?0x00ff00:p>.25?0xffaa00:0xff0000);
}
function soldier(x,z,squadId,role){
 const e=new THREE.Group();e.position.set(x,0,z);
 function part(w,h,d,c,px,py,pz){
  const m=box(e,w,h,d,c,px,py,pz);m.userData.enemy=e;targets.push(m);
 }
 part(.35,.8,.4,0x252a25,-.24,.4,0);
 part(.35,.8,.4,0x252a25,.24,.4,0);
 part(1,1.1,.55,0x42543b,0,1.35,0);
 part(.3,.9,.4,0x42543b,-.65,1.4,0);
 part(.3,.9,.4,0x42543b,.65,1.4,0);
 part(.55,.55,.5,0x9a7255,0,2.15,0);
 part(.75,.25,.7,0x303e2b,0,2.5,0);
 part(.45,.45,.04,0xff3333,0,1.4,.3);

 const rifle=new THREE.Group();rifle.position.set(.3,1.5,.45);
 box(rifle,.17,.2,.8,0x181818,0,0,.1);
 box(rifle,.09,.09,.85,0x111111,0,.05,.85);
 box(rifle,.13,.3,.17,0x382d24,0,-.22,-.12);
 e.add(rifle);
 const flash=new THREE.Group();
 const core=new THREE.Mesh(new THREE.SphereGeometry(.35,10,8),new THREE.MeshBasicMaterial({color:0xffff44,depthTest:false}));
 const burst=new THREE.Mesh(new THREE.ConeGeometry(.28,.85,8),new THREE.MeshBasicMaterial({color:0xffaa00,depthTest:false}));
 burst.rotation.x=Math.PI/2;burst.position.z=.4;
 flash.add(core,burst);flash.position.set(0,.05,1.35);flash.visible=false;rifle.add(flash);

 e.userData={
  hp:100,alive:true,x,z,squadId,role,
  mode:"patrol",phase:Math.random()*6.28,
  ammo:6,maxAmmo:6,reload:0,respawn:0,
  cooldown:1+Math.random(),tactic:0,
  cover:null,coverTime:0,flank:null,
  flash,flashTime:0,rifle,status:"",
  label:null,bar:null
 };
 e.userData.label=labelFor(e);
 e.userData.bar=healthBar(e);
 updateBar(e);status(e,"PATROL");
 scene.add(e);enemies.push(e);squads[squadId].members.push(e);
}
soldier(-3,-12,0,"suppress");
soldier(3,-23,0,"right");
soldier(-2,-35,0,"left");
soldier(3,-48,1,"suppress");
soldier(0,-62,1,"left");

// IPHONE CONTROLS
let moveX=0,moveY=0,joyId=null;
const joy=$("joystick"),stick=$("stick");
function moveStick(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
 const length=Math.hypot(x,y),max=37;
 if(length>max){x=x/length*max;y=y/length*max;}
 moveX=x/max;moveY=y/max;
 stick.style.transform=`translate(${x}px,${y}px)`;
}
joy.addEventListener("pointerdown",e=>{
 e.preventDefault();if(joyId!==null)return;
 joyId=e.pointerId;joy.setPointerCapture(joyId);moveStick(e);
});
joy.addEventListener("pointermove",e=>{if(e.pointerId===joyId)moveStick(e);});
function stopJoy(e){
 if(e.pointerId!==joyId)return;
 joyId=null;moveX=moveY=0;stick.style.transform="translate(0,0)";
}
joy.addEventListener("pointerup",stopJoy);
joy.addEventListener("pointercancel",stopJoy);

let yaw=0,pitch=0,lookId=null,lastX=0,lastY=0;
let aiming=false,aimId=null;
renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.clientX<innerWidth*.35||lookId!==null)return;
 lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;
 renderer.domElement.setPointerCapture(lookId);
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId!==lookId)return;
 const speed=aiming?.002:.004;
 yaw-=(e.clientX-lastX)*speed;
 pitch-=(e.clientY-lastY)*speed;
 pitch=THREE.MathUtils.clamp(pitch,-1.2,1.2);
 lastX=e.clientX;lastY=e.clientY;
 camera.rotation.y=yaw;camera.rotation.x=pitch;
});
function stopLook(e){if(e.pointerId===lookId)lookId=null;}
renderer.domElement.addEventListener("pointerup",stopLook);
renderer.domElement.addEventListener("pointercancel",stopLook);

let hp=100,ammo=30,kills=0,ended=false,won=false;
let damageTime=0,warningTime=0,flashTime=0,recoil=0;
function setAim(value){
 aiming=value&&!ended;
 $("aim").textContent=aiming?"AIMING":"AIM";
 $("aim").style.background=aiming?"#13865b":"#234d66";
}
$("aim").addEventListener("pointerdown",e=>{
 e.preventDefault();if(aimId!==null)return;
 aimId=e.pointerId;e.currentTarget.setPointerCapture(aimId);setAim(true);
});
function stopAim(e){
 if(e.pointerId!==aimId)return;
 aimId=null;setAim(false);
}
$("aim").addEventListener("pointerup",stopAim);
$("aim").addEventListener("pointercancel",stopAim);
$("aim").addEventListener("lostpointercapture",stopAim);
function hud(){
 $("hud").textContent=`HEALTH: ${hp} | AMMO: ${ammo}`;
 $("score").textContent=`ELIMINATIONS: ${kills}`;
}
let messageTimeout;
function message(text){
 $("message").textContent=text;
 clearTimeout(messageTimeout);
 messageTimeout=setTimeout(()=>$("message").textContent="",1100);
}

// IPHONE AUDIO
let audioContext=null,soundOn=true;
function unlock(){
 if(!soundOn)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){$("soundStatus").textContent="Audio unavailable";return;}
  if(!audioContext)audioContext=new AC();
  if(audioContext.state==="suspended"){
   audioContext.resume().then(()=>$("soundStatus").textContent="Audio ready");
  }else $("soundStatus").textContent="Audio ready";
 }catch(e){$("soundStatus").textContent="Audio error";}
}
function tone(freq,duration,type="sine",volume=.2,end=freq){
 if(!audioContext||!soundOn)return;
 const ctx=audioContext,now=ctx.currentTime;
 const o=ctx.createOscillator(),g=ctx.createGain();
 o.type=type;
 o.frequency.setValueAtTime(Math.max(25,freq),now);
 o.frequency.exponentialRampToValueAtTime(Math.max(25,end),now+duration);
 g.gain.setValueAtTime(volume,now);
 g.gain.exponentialRampToValueAtTime(.001,now+duration);
 o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+duration);
}
function noise(duration=.14,volume=.2){
 if(!audioContext||!soundOn)return;
 const ctx=audioContext,n=Math.floor(ctx.sampleRate*duration);
 const buffer=ctx.createBuffer(1,n,ctx.sampleRate),data=buffer.getChannelData(0);
 for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);
 const source=ctx.createBufferSource(),gain=ctx.createGain();
 source.buffer=buffer;gain.gain.value=volume;
 source.connect(gain);gain.connect(ctx.destination);source.start();
}
function gunSound(){noise(.16,.3);tone(135,.17,"sawtooth",.18,35);}
function enemySound(distance){
 const v=Math.max(.035,.19*(1-distance/35));
 noise(.12,v);tone(110,.14,"sawtooth",v,40);
}
function reloadSound(){tone(700,.09,"square",.14,350);}
function testSound(){
 soundOn=true;$("sound").textContent="SOUND: ON";
 unlock();tone(440,.3,"sine",.3,660);noise(.2,.3);
}
$("test").addEventListener("pointerdown",e=>{e.preventDefault();testSound();});
$("sound").addEventListener("pointerdown",e=>{
 e.preventDefault();soundOn=!soundOn;
 $("sound").textContent=soundOn?"SOUND: ON":"SOUND: OFF";
 if(soundOn){unlock();tone(550,.18,"sine",.2,440);}
 else $("soundStatus").textContent="Muted";
});

// COMBAT EFFECTS
const effects=[];
function sphereEffect(point,color,size,life){
 const m=new THREE.Mesh(new THREE.SphereGeometry(size,8,8),new THREE.MeshBasicMaterial({color,transparent:true,depthTest:false}));
 m.position.copy(point);scene.add(m);effects.push({mesh:m,life,max:life});
}
function tracer(start,end){
 const dir=end.clone().sub(start),length=dir.length();
 if(length<.01)return;
 const m=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,length,7),new THREE.MeshBasicMaterial({color:0xffff22,transparent:true,depthTest:false}));
 m.position.copy(start).add(end).multiplyScalar(.5);
 m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
 m.renderOrder=8;scene.add(m);effects.push({mesh:m,life:.5,max:.5});
}
let hitTimeout;
function hitmarker(kill){
 $("hitmark").style.color=kill?"#ff3333":"white";
 $("hitmark").style.display="block";
 clearTimeout(hitTimeout);
 hitTimeout=setTimeout(()=>$("hitmark").style.display="none",180);
}

// ENEMY MOVEMENT
function moveEnemy(e,x,z,speed,dt){
 const dx=x-e.position.x,dz=z-e.position.z,dist=Math.hypot(dx,dz);
 if(dist<.08)return dist;
 const step=Math.min(dist,speed*dt),vx=dx/dist,vz=dz/dist;
 const ox=e.position.x,oz=e.position.z;
 const nx=ox+vx*step,nz=oz+vz*step;
 if(!collides(nx,nz,.4)){e.position.set(nx,0,nz);return dist;}
 if(!collides(nx,oz,.4)){e.position.x=nx;return dist;}
 if(!collides(ox,nz,.4)){e.position.z=nz;return dist;}
 for(const sign of [1,-1]){
  const sx=ox-vz*step*sign,sz=oz+vx*step*sign;
  if(!collides(sx,sz,.4)){e.position.set(sx,0,sz);break;}
 }
 return dist;
}
function findCover(e){
 let best=null,closest=Infinity;
 for(const b of barriers){
  if(Math.hypot(e.position.x-b.x,e.position.z-b.z)>13)continue;
  const dx=b.x-camera.position.x,dz=b.z-camera.position.z,len=Math.hypot(dx,dz)||1;
  const x=THREE.MathUtils.clamp(b.x+dx/len*1.65,-5.3,5.3),z=b.z+dz/len*1.65;
  if(collides(x,z,.4))continue;
  const dist=Math.hypot(e.position.x-x,e.position.z-z);
  if(dist<closest){closest=dist;best={x,z};}
 }
 return best;
}
function findFlank(e){
 const d=e.userData,side=d.role==="right"?1:-1;
 const dx=camera.position.x-e.position.x,dz=camera.position.z-e.position.z,len=Math.hypot(dx,dz)||1;
 for(const offset of [5,4,3,2]){
  const x=THREE.MathUtils.clamp(camera.position.x-dz/len*side*offset,-5.2,5.2);
  const z=THREE.MathUtils.clamp(camera.position.z+dx/len*side*offset,-74,74);
  if(!collides(x,z,.55))return {x,z};
 }
 return {x:e.position.x,z:e.position.z};
}
function alertSquad(e){
 const s=squads[e.userData.squadId];s.alert=8;
 for(const member of s.members)if(member.userData.alive)member.userData.tactic=0;
}
function startReload(e){
 const d=e.userData;
 d.mode="reload";d.reload=2.4;d.flashTime=0;d.flash.visible=false;
 status(e,"RELOADING");
}
function chooseTactic(e,dist){
 const d=e.userData;
 if(d.hp<=50){
  const cover=findCover(e);
  if(cover){d.cover=cover;d.coverTime=2.8;d.mode="coverMove";status(e,"TAKING COVER");return;}
 }
 if(d.role!=="suppress"&&dist<28){
  d.flank=findFlank(e);d.mode="flank";d.tactic=3.5;status(e,"FLANKING");return;
 }
 if(d.role==="suppress"&&dist<25){
  d.mode="suppress";d.tactic=3;status(e,"SUPPRESSING");return;
 }
 d.mode="chase";d.tactic=2.5;status(e,"ADVANCING");
}

// RAYCAST AND PLAYER FIRE
const ray=new THREE.Raycaster(),sight=new THREE.Raycaster();
const solidSet=new Set(solids),shootables=[...targets,...solids];
function shoot(){
 if(ended)return;
 unlock();
 if(ammo<=0){message("OUT OF AMMO - RELOAD");return;}
 ammo--;recoil=.12;flashTime=.15;playerFlash.visible=true;
 gunSound();hud();
 camera.updateMatrixWorld(true);scene.updateMatrixWorld(true);
 ray.setFromCamera(new THREE.Vector2(0,0),camera);ray.far=100;
 const hit=ray.intersectObjects(shootables,false).find(h=>
  solidSet.has(h.object)||(h.object.userData.enemy&&h.object.userData.enemy.userData.alive)
 );
 if(!hit){message("MISSED");return;}
 if(solidSet.has(hit.object)){
  sphereEffect(hit.point,0xffcc33,.18,.25);message("OBJECT HIT");return;
 }
 const e=hit.object.userData.enemy,d=e.userData;
 d.hp-=50;updateBar(e);
 sphereEffect(hit.point,0xffcc33,.18,.25);
 hitmarker(d.hp<=0);tone(250,.13,"triangle",.1,80);
 alertSquad(e);
 if(d.hp<=0){
  d.alive=false;e.visible=false;d.respawn=5;d.flash.visible=false;
  kills++;hud();message("ENEMY ELIMINATED!");
 }else{
  const cover=findCover(e);
  if(cover){d.cover=cover;d.coverTime=2.8;d.mode="coverMove";status(e,"TAKING COVER");}
  message("ENEMY HIT!");
 }
}
$("fire").addEventListener("pointerdown",e=>{e.preventDefault();shoot();});
$("reload").addEventListener("pointerdown",e=>{
 e.preventDefault();if(ended)return;
 unlock();ammo=30;reloadSound();hud();message("RELOADED");
});

function clearShot(e){
 e.updateMatrixWorld(true);scene.updateMatrixWorld(true);
 const start=e.localToWorld(new THREE.Vector3(.3,1.55,1.8));
 const dir=camera.position.clone().sub(start),dist=dir.length();
 if(dist<.1)return true;
 sight.set(start,dir.normalize());sight.far=dist;
 return sight.intersectObjects(solids,false).length===0;
}
function enemyFire(e,dist,suppress){
 const d=e.userData;
 if(d.ammo<=0){startReload(e);return;}
 d.ammo--;d.flashTime=.4;d.flash.visible=true;
 e.updateMatrixWorld(true);
 const start=e.localToWorld(new THREE.Vector3(.3,1.55,1.8));
 const end=camera.position.clone(),spread=suppress?2.3:.35;
 end.x+=(Math.random()-.5)*spread;
 end.y+=(Math.random()-.5)*spread;
 end.z+=(Math.random()-.5)*spread;
 tracer(start,end);enemySound(dist);
 if(Math.random()<(suppress?.22:.82))takeDamage(10);
 if(d.ammo<=0)startReload(e);
}
function finish(success){
 ended=true;won=success;moveX=moveY=0;setAim(false);
 $("result").textContent=success?"MISSION COMPLETE!":"MISSION FAILED";
 $("final").textContent="Operation Steel City | Eliminations: "+kills;
 $("end").style.display="flex";
}
function takeDamage(amount){
 if(ended)return;
 hp=Math.max(0,hp-amount);
 damageTime=.65;warningTime=.65;
 hud();message("UNDER FIRE!");
 if(hp<=0)finish(false);
}
function updateMission(){
 if(ended)return;
 if(kills<3){
  $("mission").textContent=`MISSION: ELIMINATE ${3-kills} MORE ENEMIES`;
  return;
 }
 $("mission").textContent="MISSION: REACH GREEN CHECKPOINT";
 const target=new THREE.Vector3();marker.getWorldPosition(target);
 if(Math.hypot(camera.position.x-target.x,camera.position.z-target.z)<2.5)finish(true);
}
$("restart").addEventListener("click",()=>location.reload());

// GAME LOOP
const clock=new THREE.Clock();
let hudTimer=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 camera.fov=THREE.MathUtils.lerp(camera.fov,aiming?45:75,Math.min(1,dt*10));
 camera.updateProjectionMatrix();
 gunBase.lerp(aiming?gunAim:gunNormal,Math.min(1,dt*12));
 recoil=Math.max(0,recoil-dt*.5);
 gun.position.copy(gunBase);gun.position.z+=recoil;
 flashTime=Math.max(0,flashTime-dt);
 playerFlash.visible=flashTime>0;

 if(!ended){
  const speed=aiming?3.5:6;
  const forward=-moveY*speed*dt,sideways=moveX*speed*dt;
  const dx=-Math.sin(yaw)*forward+Math.cos(yaw)*sideways;
  const dz=-Math.cos(yaw)*forward-Math.sin(yaw)*sideways;
  const nx=THREE.MathUtils.clamp(camera.position.x+dx,-8,8);
  if(!collides(nx,camera.position.z))camera.position.x=nx;
  const nz=THREE.MathUtils.clamp(camera.position.z+dz,-75,75);
  if(!collides(camera.position.x,nz))camera.position.z=nz;

  for(const s of squads)s.alert=Math.max(0,s.alert-dt);

  for(const e of enemies){
   const d=e.userData;
   d.flashTime=Math.max(0,d.flashTime-dt);
   d.flash.visible=d.alive&&d.flashTime>0;
   d.bar.g.quaternion.copy(camera.quaternion);

   if(!d.alive){
    d.respawn-=dt;
    if(d.respawn<=0){
     d.alive=true;d.hp=100;d.ammo=d.maxAmmo;
     d.mode="patrol";d.cooldown=1.5;d.tactic=0;
     d.cover=null;d.flank=null;d.flashTime=0;
     d.rifle.rotation.x=0;e.position.set(d.x,0,d.z);
     e.visible=true;updateBar(e);status(e,"PATROL");
    }
    continue;
   }

   d.phase+=dt;
   let dx=camera.position.x-e.position.x;
   let dz=camera.position.z-e.position.z;
   let dist=Math.hypot(dx,dz);
   e.rotation.y=Math.atan2(dx,dz);

   if(d.mode==="reload"){
    d.reload-=dt;
    d.rifle.rotation.x=THREE.MathUtils.lerp(d.rifle.rotation.x,.55,Math.min(1,dt*9));
    if(d.reload<=0){
     d.ammo=d.maxAmmo;d.mode="chase";
     d.tactic=0;d.cooldown=.4;
     d.rifle.rotation.x=0;status(e,"READY");
    }
    continue;
   }

   d.rifle.rotation.x=THREE.MathUtils.lerp(d.rifle.rotation.x,0,Math.min(1,dt*8));
   d.cooldown-=dt;d.tactic-=dt;
   const squad=squads[d.squadId];
   if(dist<22)squad.alert=Math.max(squad.alert,3);

   if(d.mode==="coverMove"&&d.cover){
    const remaining=moveEnemy(e,d.cover.x,d.cover.z,3.5,dt);
    status(e,"TAKING COVER");
    if(remaining<.35){
     d.mode="inCover";d.coverTime=2.5;status(e,"IN COVER");
    }
   }else if(d.mode==="inCover"){
    d.coverTime-=dt;
    if(d.coverTime<=0){
     d.mode="chase";d.cover=null;d.tactic=0;
    }
   }else if(d.mode==="flank"){
    status(e,"FLANKING");
    if(!d.flank||d.tactic<=0){
     d.flank=findFlank(e);d.tactic=3.5;
    }
    const remaining=moveEnemy(e,d.flank.x,d.flank.z,3.2,dt);
    if(remaining<.6){
     d.mode="chase";d.tactic=1.5;status(e,"ATTACKING");
    }
   }else if(d.mode==="suppress"){
    status(e,"SUPPRESSING");
    if(dist>12&&dist<28)moveEnemy(e,camera.position.x,camera.position.z,1.5,dt);
    if(d.tactic<=0){d.mode="chase";d.tactic=0;}
   }else if(dist<28||squad.alert>0){
    if(d.tactic<=0)chooseTactic(e,dist);
    if(d.mode==="chase"){
     status(e,"ADVANCING");
     if(dist>12)moveEnemy(e,camera.position.x,camera.position.z,2.5,dt);
    }
   }else{
    d.mode="patrol";status(e,"PATROL");
    const home=Math.hypot(d.x-e.position.x,d.z-e.position.z);
    if(home>1)moveEnemy(e,d.x,d.z,1.2,dt);
    else moveEnemy(e,d.x+Math.sin(d.phase)*1.5,d.z,1.2,dt);
   }

   dx=camera.position.x-e.position.x;
   dz=camera.position.z-e.position.z;
   dist=Math.hypot(dx,dz);
   if(dist<18&&d.cooldown<=0&&d.mode!=="inCover"&&d.mode!=="coverMove"){
    if(d.ammo<=0)startReload(e);
    else if(clearShot(e)){
     const suppress=d.mode==="suppress";
     enemyFire(e,dist,suppress);
     d.cooldown=suppress?.7:1.6;
    }else d.cooldown=.5;
   }
  }

  hudTimer-=dt;
  if(hudTimer<=0){
   $("squads").textContent=squads.map(s=>{
    const live=s.members.filter(e=>e.userData.alive);
    const flank=live.filter(e=>e.userData.mode==="flank").length;
    const reload=live.filter(e=>e.userData.mode==="reload").length;
    return `${s.name}: ${s.alert>0?"ENGAGED":"PATROL"} | FLANK ${flank} | RELOAD ${reload}`;
   }).join("\n");
   hudTimer=.3;
  }

  damageTime=Math.max(0,damageTime-dt);
  warningTime=Math.max(0,warningTime-dt);
  $("damage").style.opacity=damageTime*.8;
  $("warning").style.opacity=warningTime;
  updateMission();
 }

 for(let i=effects.length-1;i>=0;i--){
  const fx=effects[i];fx.life-=dt;
  fx.mesh.material.opacity=Math.max(0,fx.life/fx.max);
  if(fx.life<=0){
   scene.remove(fx.mesh);
   fx.mesh.geometry.dispose();
   fx.mesh.material.dispose();
   effects.splice(i,1);
  }
 }

 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
window.addEventListener("error",e=>{
 $("error").style.display="block";
 $("error").textContent="Game error: "+e.message;
});
window.addEventListener("unhandledrejection",e=>{
 $("error").style.display="block";
 $("error").textContent="Game error: "+String(e.reason);
});
</script>
</body>
</html>
