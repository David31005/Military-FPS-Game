
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pittsburgh Streets</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#87a9c4;
 font-family:Arial,sans-serif;
 touch-action:none;
}
canvas{display:block;touch-action:none}
#title,#score,#mission,#message,#hud,#crosshair{
 position:absolute;z-index:3;pointer-events:none;
 text-shadow:1px 2px 4px #000;
}
#title{
 top:calc(10px + env(safe-area-inset-top));
 width:100%;text-align:center;
 font-size:21px;font-weight:bold;color:white;
}
#score{
 top:calc(48px + env(safe-area-inset-top));
 width:100%;text-align:center;
 color:#ffe46b;font-weight:bold;
}
#mission{
 top:calc(78px + env(safe-area-inset-top));
 width:100%;text-align:center;
 color:#00ff88;font-size:14px;font-weight:bold;
}
#message{
 top:calc(108px + env(safe-area-inset-top));
 width:100%;text-align:center;
 color:#ffe46b;font-weight:bold;
}
#crosshair{
 top:50%;left:50%;transform:translate(-50%,-50%);
 color:white;font-size:34px;
}
#hud{
 left:15px;
 bottom:calc(165px + env(safe-area-inset-bottom));
 color:white;font-size:16px;
}
#damage{
 position:absolute;inset:0;z-index:2;
 background:rgba(255,0,0,.35);
 opacity:0;pointer-events:none;
}
#joystick{
 position:absolute;z-index:4;
 bottom:calc(25px + env(safe-area-inset-bottom));
 left:25px;width:125px;height:125px;
 border:2px solid #ffffff99;
 border-radius:50%;background:#ffffff33;
 touch-action:none;
}
#stick{
 position:absolute;top:36px;left:36px;
 width:50px;height:50px;border-radius:50%;
 background:#ffffffbb;pointer-events:none;
}
button{touch-action:none}
#fire{
 position:absolute;z-index:4;
 right:25px;
 bottom:calc(40px + env(safe-area-inset-bottom));
 width:95px;height:95px;
 border-radius:50%;
 background:#c62828;color:white;
 border:3px solid white;
 font-size:19px;font-weight:bold;
}
#reload{
 position:absolute;z-index:4;
 right:40px;
 bottom:calc(145px + env(safe-area-inset-bottom));
 padding:10px 15px;
 background:#333;color:white;
 border:1px solid white;border-radius:10px;
 font-weight:bold;
}
#gameover{
 display:none;position:absolute;inset:0;
 z-index:10;background:#000e;color:white;
 align-items:center;justify-content:center;
 flex-direction:column;gap:20px;text-align:center;
}
#restart{
 padding:15px 25px;background:#c62828;
 color:white;border:2px solid white;
 border-radius:12px;font-size:18px;
}
#error{
 position:absolute;top:145px;left:10px;right:10px;
 z-index:20;color:white;background:#a00000;
 padding:12px;display:none;font-size:13px;
}
</style>
</head>
<body>

<div id="damage"></div>
<div id="title">PITTSBURGH STREETS</div>
<div id="score">ELIMINATIONS: 0</div>
<div id="mission">MISSION: ELIMINATE 3 ENEMIES</div>
<div id="message"></div>
<div id="crosshair">+</div>
<div id="hud">HEALTH: 100 | AMMO: 30</div>

<div id="joystick"><div id="stick"></div></div>
<button id="fire">FIRE</button>
<button id="reload">RELOAD</button>

<div id="gameover">
 <h1 id="resultTitle">MISSION FAILED</h1>
 <div id="finalscore"></div>
 <button id="restart">RESTART MISSION</button>
</div>
<div id="error"></div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87a9c4);
scene.fog=new THREE.Fog(0x87a9c4,55,140);

const camera=new THREE.PerspectiveCamera(
 75,window.innerWidth/window.innerHeight,.05,250
);
camera.position.set(0,1.7,8);
camera.rotation.order="YXZ";
camera.lookAt(0,1.7,-20);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 alpha:false,
 powerPreference:"default"
});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x87a9c4,1);
renderer.domElement.style.position="absolute";
renderer.domElement.style.inset="0";
renderer.domElement.style.zIndex="0";
document.body.insertBefore(
 renderer.domElement,document.body.firstChild
);

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(10,25,10);
scene.add(sun);

function makeBox(parent,w,h,d,color,x,y,z){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshBasicMaterial({color})
 );
 mesh.position.set(x,y,z);
 parent.add(mesh);
 return mesh;
}

// CITY GROUND
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshBasicMaterial({
  color:0x527044,side:THREE.DoubleSide
 })
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.02;
scene.add(ground);

// MAIN ROAD
const road=new THREE.Mesh(
 new THREE.PlaneGeometry(12,180),
 new THREE.MeshBasicMaterial({
  color:0x303238,side:THREE.DoubleSide
 })
);
road.rotation.x=-Math.PI/2;
road.position.y=.025;
scene.add(road);

// SIDEWALKS
makeBox(scene,3,.2,180,0x999999,-7.5,.1,0);
makeBox(scene,3,.2,180,0x999999,7.5,.1,0);

// CITY BUILDINGS
const colors=[0x885544,0x777777,0x554c48,0x99775b];
for(let i=0;i<12;i++){
 const z=15-i*12;
 const h=7+(i%4)*2;
 makeBox(scene,8,h,9,colors[i%4],-13,h/2,z);
 makeBox(scene,8,h+2,9,
  colors[(i+1)%4],13,(h+2)/2,z);
}

// YELLOW ROAD MARKINGS
for(let z=-75;z<75;z+=9){
 const line=new THREE.Mesh(
  new THREE.PlaneGeometry(.25,4),
  new THREE.MeshBasicMaterial({
   color:0xffd447,side:THREE.DoubleSide
  })
 );
 line.rotation.x=-Math.PI/2;
 line.position.set(0,.055,z);
 scene.add(line);
}

// ADDITIONAL CROSS STREET
const crossRoad=new THREE.Mesh(
 new THREE.PlaneGeometry(80,10),
 new THREE.MeshBasicMaterial({
  color:0x303238,side:THREE.DoubleSide
 })
);
crossRoad.rotation.x=-Math.PI/2;
crossRoad.position.set(0,.04,-32);
scene.add(crossRoad);

// FIRST PERSON RIFLE
const gun=new THREE.Group();
camera.add(gun);
scene.add(camera);

gun.position.set(.28,-.18,-1.2);
gun.scale.set(1.4,1.4,1.4);

makeBox(gun,.22,.22,.65,0x30343a,0,0,0);
makeBox(gun,.12,.12,.7,0x171b20,0,.09,-.45);
makeBox(gun,.15,.25,.2,0x4d3b2e,0,-.2,.15);
makeBox(gun,.1,.12,.18,0x111111,0,.2,-.15);

 // STEP 8A - RIFLE MUZZLE FLASH

const muzzleFlash = new THREE.Mesh(
  new THREE.SphereGeometry(0.12, 8, 8),
  new THREE.MeshBasicMaterial({
    color: 0xffcc00,
    transparent: true,
    opacity: 0.95,
    depthTest: false
  })
);

muzzleFlash.position.set(0, 0.1, -0.85);
muzzleFlash.visible = false;
gun.add(muzzleFlash);

let flashTimer = 0;

// STEP 7 MILITARY CHECKPOINT
const checkpoint=new THREE.Group();
checkpoint.position.set(0,0,-55);
scene.add(checkpoint);

makeBox(checkpoint,2,1.2,1,0x888888,-4,.6,0);
makeBox(checkpoint,2,1.2,1,0x888888,4,.6,0);
makeBox(checkpoint,1.5,3,1.5,0x4c5b42,-6,1.5,0);
makeBox(checkpoint,1.5,3,1.5,0x4c5b42,6,1.5,0);
makeBox(checkpoint,14,.5,.7,0x303030,0,4,0);

const marker=new THREE.Mesh(
 new THREE.CylinderGeometry(1.2,1.2,.12,32),
 new THREE.MeshBasicMaterial({color:0x00ff66})
);
marker.position.set(0,.15,-4);
checkpoint.add(marker);

 // STEP 8B - ENEMY HEALTH BARS

function createHealthBar(soldier) {
  const group = new THREE.Group();
  group.position.set(0, 3.1, 0);

  const background = new THREE.Mesh(
    new THREE.PlaneGeometry(1.2, 0.16),
    new THREE.MeshBasicMaterial({
      color: 0x333333,
      side: THREE.DoubleSide,
      depthTest: false
    })
  );

  const fill = new THREE.Mesh(
    new THREE.PlaneGeometry(1.1, 0.1),
    new THREE.MeshBasicMaterial({
      color: 0x00ff00,
      side: THREE.DoubleSide,
      depthTest: false
    })
  );

  fill.position.z = 0.01;

  group.add(background);
  group.add(fill);
  soldier.add(group);

  soldier.userData.healthBar = group;
  soldier.userData.healthFill = fill;
}

function updateHealthBar(soldier) {
  const health = Math.max(
    0,
    soldier.userData.health
  );

  const fill = soldier.userData.healthFill;
  if (!fill) return;

  const percent = health / 100;

  fill.scale.x = Math.max(0.001, percent);
  fill.position.x = -(1.1 * (1 - percent)) / 2;

  fill.material.color.setHex(
    percent > 0.5 ? 0x00ff00 :
    percent > 0.25 ? 0xffaa00 :
    0xff0000
  );
}

// ENEMY SOLDIERS
const enemies=[];
const targets=[];

function createEnemy(x,z){
 const soldier=new THREE.Group();
 soldier.position.set(x,0,z);

 function part(w,h,d,c,px,py,pz){
  const mesh=makeBox(soldier,w,h,d,c,px,py,pz);
  mesh.userData.enemy=soldier;
  targets.push(mesh);
 }

 part(.35,.8,.4,0x252a25,-.24,.4,0);
 part(.35,.8,.4,0x252a25,.24,.4,0);
 part(1,1.1,.55,0x42543b,0,1.35,0);
 part(.3,.9,.4,0x42543b,-.65,1.4,0);
 part(.3,.9,.4,0x42543b,.65,1.4,0);
 part(.55,.55,.5,0x9a7255,0,2.15,0);
 part(.75,.25,.7,0x303e2b,0,2.5,0);
 part(.45,.45,.04,0xff3333,0,1.4,.3);

 soldier.userData={
  health:100,
  alive:true,
  homeX:x,
  homeZ:z,
  phase:Math.random()*6.28,
  cooldown:2,
  respawn:0
 };

 
createHealthBar(soldier);
updateHealthBar(soldier);

scene.add(soldier);
enemies.push(soldier);

}

createEnemy(-3,-12);
createEnemy(3,-23);
createEnemy(-2,-35);
createEnemy(3,-48);
createEnemy(0,-62);

// IPHONE MOVEMENT CONTROLS
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let moveX=0,moveY=0,joyId=null;

function updateStick(e){
 const r=joystick.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const d=Math.hypot(x,y);
 const max=37;
 if(d>max){
  x=x/d*max;
  y=y/d*max;
 }
 moveX=x/max;
 moveY=y/max;
 stick.style.transform=
  "translate("+x+"px,"+y+"px)";
}

joystick.addEventListener("pointerdown",e=>{
 if(joyId!==null)return;
 joyId=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 updateStick(e);
});
joystick.addEventListener("pointermove",e=>{
 if(e.pointerId===joyId)updateStick(e);
});
function stopStick(e){
 if(e.pointerId!==joyId)return;
 joyId=null;
 moveX=0;moveY=0;
 stick.style.transform="translate(0px,0px)";
}
joystick.addEventListener("pointerup",stopStick);
joystick.addEventListener("pointercancel",stopStick);

// TOUCH AIMING
let lookId=null,lastX=0,lastY=0;
let yaw=0,pitch=0;

renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.clientX<innerWidth*.35||lookId!==null)return;
 lookId=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId!==lookId)return;
 yaw-=(e.clientX-lastX)*.004;
 pitch-=(e.clientY-lastY)*.004;
 pitch=Math.max(-1.2,Math.min(1.2,pitch));
 lastX=e.clientX;
 lastY=e.clientY;
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
});
function stopLook(e){
 if(e.pointerId===lookId)lookId=null;
}
renderer.domElement.addEventListener("pointerup",stopLook);
renderer.domElement.addEventListener("pointercancel",stopLook);

// GAME STATE
let health=100;
let ammo=30;
let eliminations=0;
let gameEnded=false;
let missionComplete=false;
let damageFlash=0;
let recoil=0;

const hud=document.getElementById("hud");
const score=document.getElementById("score");
const missionDisplay=document.getElementById("mission");
const message=document.getElementById("message");

function updateHUD(){
 hud.textContent="HEALTH: "+health+" | AMMO: "+ammo;
 score.textContent="ELIMINATIONS: "+eliminations;
}

let messageTimer;
function showMessage(text){
 message.textContent=text;
 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>{
  message.textContent="";
 },1000);
}

// SHOOTING
const raycaster=new THREE.Raycaster();
const center=new THREE.Vector2(0,0);

function shoot(){
 if(gameEnded||missionComplete)return;
 if(ammo<=0){
  showMessage("OUT OF AMMO - RELOAD");
  return;
 }

 
ammo--;
recoil=.12;
flashTimer=.09;
muzzleFlash.visible=true;
updateHUD();


 raycaster.setFromCamera(center,camera);
 raycaster.far=100;

 const hits=raycaster.intersectObjects(targets,false);
 const hit=hits.find(h=>
  h.object.userData.enemy.userData.alive
 );

 if(hit){
  const soldier=hit.object.userData.enemy;
  soldier.userData.health-=50;
  
updateHealthBar(soldier);


  if(soldier.userData.health<=0){
   soldier.userData.alive=false;
   soldier.visible=false;
   soldier.userData.respawn=5;
   eliminations++;
   updateHUD();
   showMessage("ENEMY ELIMINATED!");
  }else{
   showMessage("ENEMY HIT!");
  }
 }else{
  showMessage("MISSED");
 }
}

document.getElementById("fire")
.addEventListener("pointerdown",e=>{
 e.preventDefault();
 shoot();
});

document.getElementById("reload")
.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(gameEnded||missionComplete)return;
 ammo=30;
 updateHUD();
 showMessage("RELOADED");
});

// ENEMY DAMAGE
function takeDamage(amount){
 if(gameEnded||missionComplete)return;

 health=Math.max(0,health-amount);
 damageFlash=.5;
 updateHUD();
 showMessage("UNDER FIRE!");

 if(health<=0){
  gameEnded=true;
  moveX=0;moveY=0;
  document.getElementById("resultTitle")
   .textContent="MISSION FAILED";
  document.getElementById("finalscore")
   .textContent="Eliminations: "+eliminations;
  document.getElementById("gameover")
   .style.display="flex";
 }
}

// MISSION OBJECTIVES
function updateMission(){
 if(missionComplete||gameEnded)return;

 if(eliminations<3){
  missionDisplay.textContent=
   "MISSION: ELIMINATE "+
   (3-eliminations)+" MORE ENEMIES";
  return;
 }

 missionDisplay.textContent=
  "MISSION: REACH GREEN CHECKPOINT";

 const target=new THREE.Vector3();
 marker.getWorldPosition(target);

 const distance=Math.hypot(
  camera.position.x-target.x,
  camera.position.z-target.z
 );

 if(distance<2.5){
  missionComplete=true;
  moveX=0;moveY=0;
  missionDisplay.textContent="MISSION COMPLETE!";
  document.getElementById("resultTitle")
   .textContent="MISSION COMPLETE!";
  document.getElementById("finalscore")
   .textContent=
   "Operation Steel City | Eliminations: "+
   eliminations;
  document.getElementById("gameover")
   .style.display="flex";
 }
}

document.getElementById("restart")
.addEventListener("click",()=>location.reload());

// ANIMATION LOOP
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 if(!gameEnded&&!missionComplete){
  const speed=6;
  const forward=-moveY*speed*dt;
  const sideways=moveX*speed*dt;

  camera.position.x+=
   -Math.sin(yaw)*forward+
   Math.cos(yaw)*sideways;
  camera.position.z+=
   -Math.cos(yaw)*forward-
   Math.sin(yaw)*sideways;

  camera.position.x=Math.max(
   -8,Math.min(8,camera.position.x)
  );
  camera.position.z=Math.max(
   -75,Math.min(75,camera.position.z)
  );

  for(const enemy of enemies){
   const data=enemy.userData;

if (data.healthBar) {
  data.healthBar.quaternion.copy(camera.quaternion);
}

   if(!data.alive){
    data.respawn-=dt;
    if(data.respawn<=0){
     data.alive=true;
     data.health=100;
     enemy.visible=true;  
     
updateHealthBar(enemy);

     enemy.position.set(data.homeX,0,data.homeZ);
     data.cooldown=2;
    }
    continue;
   }

   
 // STEP 8C - SMART ENEMY AI
data.phase += dt;

let dx = camera.position.x - enemy.position.x;
let dz = camera.position.z - enemy.position.z;
let distance = Math.hypot(dx, dz);

const detectionRange = 28;
const attackRange = 14;
const chaseSpeed = 2.2;
const returnSpeed = 1.2;

if (distance < detectionRange) {
  enemy.rotation.y = Math.atan2(dx, dz);

  if (distance > attackRange && distance > 0.01) {
    enemy.position.x += (dx / distance) * chaseSpeed * dt;
    enemy.position.z += (dz / distance) * chaseSpeed * dt;
  }
} else {
  const homeDX = data.homeX - enemy.position.x;
  const homeDZ = data.homeZ - enemy.position.z;
  const homeDistance = Math.hypot(homeDX, homeDZ);

  if (homeDistance > 1) {
    enemy.position.x +=
      (homeDX / homeDistance) * returnSpeed * dt;
    enemy.position.z +=
      (homeDZ / homeDistance) * returnSpeed * dt;
  } else {
    enemy.position.x =
      data.homeX + Math.sin(data.phase) * 1.5;
  }
}

dx = camera.position.x - enemy.position.x;
dz = camera.position.z - enemy.position.z;
distance = Math.hypot(dx, dz);

data.cooldown -= dt;

if (distance < attackRange && data.cooldown <= 0) {
  data.cooldown = 2.5;
  takeDamage(10);
}

   }
  }

  recoil=Math.max(0,recoil-dt*.5);
  
flashTimer=Math.max(0,flashTimer-dt);
muzzleFlash.visible=flashTimer>0;

  gun.position.z=-1.2+recoil;

  damageFlash=Math.max(0,damageFlash-dt);
  document.getElementById("damage")
   .style.opacity=damageFlash;

  updateMission();
 }

 renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

// Report unexpected JavaScript errors
window.addEventListener("error",e=>{
 const box=document.getElementById("error");
 box.style.display="block";
 box.textContent="Game error: "+e.message;
});

</script>
</body>
</html>
