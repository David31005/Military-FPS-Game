
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pittsburgh Streets 9K</title>
<style>
*{box-sizing:border-box;touch-action:none}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;top:8px;width:100%;text-align:center;font-weight:bold;font-size:19px;text-shadow:1px 2px 3px black}
#mission{font-size:12px;color:#aaffaa;margin-top:5px}
#stats{position:absolute;top:72px;left:8px;background:#14242bcc;padding:8px;border-radius:8px;font-size:12px;line-height:1.6}
#health{position:absolute;bottom:175px;left:10px;background:#14242bcc;padding:8px;border-radius:8px;font-size:13px}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:30px;text-shadow:0 0 5px black}
#scope{display:none;position:absolute;inset:0;background:radial-gradient(circle,transparent 0 26%,#050505 27%);align-items:center;justify-content:center;font-size:35px}
#notice{position:absolute;top:31%;width:100%;text-align:center;font-size:20px;font-weight:bold;color:#ffeb66;text-shadow:1px 2px 4px black}
#damage{position:absolute;inset:0;background:red;opacity:0}
#joy{position:fixed;bottom:30px;left:18px;width:125px;height:125px;border:3px solid #ffffff88;border-radius:50%;background:#ffffff25}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffffbb}
button{border:2px solid #ffffff99;border-radius:12px;background:#24465c;color:white;font-size:12px;font-weight:bold;padding:10px}
#actions{position:fixed;right:12px;bottom:30px;display:grid;grid-template-columns:75px 90px;gap:8px}
#fire{grid-row:span 2;background:#c52b2b;border-radius:50%;font-size:19px}
#guns{position:fixed;right:9px;top:145px;display:flex;flex-direction:column;gap:5px}
#guns button.active{background:#238b4d}
#extras{position:fixed;left:8px;top:145px;display:flex;flex-direction:column;gap:5px}
#start,#finish{position:fixed;inset:0;background:#081520ee;display:flex;align-items:center;justify-content:center;text-align:center;z-index:10;padding:25px}
#finish{display:none}
#start button,#finish button{background:#24824c;font-size:18px;padding:16px}
#start p{line-height:1.5}
</style>
</head>
<body>

<div id="hud">
<div id="damage"></div>
<div id="title">
PITTSBURGH STREETS
<div id="mission">STEP 9K</div>
</div>
<div id="stats">
KILLS: <span id="kills">0</span><br>
ENEMIES: <span id="enemies">0</span><br>
GRENADES: <span id="grenades">3</span>
</div>
<div id="health">
HP: <span id="hp">100</span> |
<span id="weapon">M4</span>
<span id="ammo">30/180</span>
</div>
<div id="cross">+</div>
<div id="scope">+</div>
<div id="notice"></div>
</div>

<div id="joy"><div id="knob"></div></div>

<div id="extras">
<button id="grenade">GRENADE</button>
<button id="sound">SOUND ON</button>
<button id="test">TEST SOUND</button>
</div>

<div id="guns">
<button data-gun="m4" class="active">M4</button>
<button data-gun="ak">AK-47</button>
<button data-gun="sniper">SNIPER</button>
</div>

<div id="actions">
<button id="aim">AIM</button>
<button id="fire">FIRE</button>
<button id="reload">RELOAD</button>
</div>

<div id="start">
<div>
<h1>PITTSBURGH STREETS</h1>
<p>STEP 9K — WEAPON UPGRADE</p>
<p>Visible rifles, hands, bullet tracers, muzzle flashes, and three mission waves.</p>
<button id="play">START MISSION</button>
</div>
</div>

<div id="finish">
<div>
<h1 id="result">MISSION COMPLETE</h1>
<p id="score"></p>
<button id="restart">PLAY AGAIN</button>
</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const $=id=>document.getElementById(id);
let scene,camera,renderer,clock;
let soldiers=[],items=[],effects=[];
let player={x:0,z:15,hp:100};
let yaw=0,pitch=0,wave=0,kills=0,grenades=3;
let playing=false,aiming=false,firing=false;
let soundOn=true,audioContext;
let current="m4",lastShot=0,reloadTime=0;
let checkpoint=null,weaponModel,muzzlePoint;
let joy={x:0,y:0},keys={};
let wavePending=false,session=0;
let recoil=0,walkTime=0;

const specs={
m4:{name:"M4",size:30,rate:115,damage:34,range:100,spread:.018},
ak:{name:"AK-47",size:30,rate:160,damage:43,range:90,spread:.028},
sniper:{name:"SNIPER",size:5,rate:1050,damage:120,range:180,spread:.003}
};
let guns={};

function mat(c){
return new THREE.MeshLambertMaterial({color:c});
}
function cube(w,h,d,c,x,y,z,parent=scene){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));
m.position.set(x,y,z);
parent.add(m);
return m;
}
function ball(r,c,x,y,z,parent=scene){
const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat(c));
m.position.set(x,y,z);
parent.add(m);
return m;
}
function sound(freq=160,duration=.12,volume=.06){
if(!soundOn)return;
try{
audioContext??=new(window.AudioContext||window.webkitAudioContext)();
audioContext.resume();
const o=audioContext.createOscillator();
const g=audioContext.createGain();
o.type="sawtooth";
o.frequency.setValueAtTime(freq,audioContext.currentTime);
o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.5),audioContext.currentTime+duration);
g.gain.setValueAtTime(volume,audioContext.currentTime);
g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
o.connect(g);g.connect(audioContext.destination);
o.start();o.stop(audioContext.currentTime+duration);
}catch(e){}
}
function message(t){
$("notice").textContent=t;
clearTimeout(message.timer);
message.timer=setTimeout(()=>$("notice").textContent="",1300);
}

function setup(){
scene=new THREE.Scene();
scene.background=new THREE.Color(0x91abc4);
scene.fog=new THREE.Fog(0x91abc4,55,145);

camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,220);
camera.rotation.order="YXZ";

/* CRITICAL FIX: ADD CAMERA TO SCENE */
scene.add(camera);

renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x5c584d,2));
const sun=new THREE.DirectionalLight(0xffd6a0,1.5);
sun.position.set(-25,45,20);
scene.add(sun);

cube(180,.2,210,0x506950,0,-.2,-30);
cube(19,.05,190,0x34363b,0,0,-30);

for(let z=-115;z<65;z+=9){
cube(.25,.02,3.5,0xf2c85b,0,.05,z);
cube(3,.1,8,0x858585,-11,.05,z);
cube(3,.1,8,0x858585,11,.05,z);
}

const colors=[0x95735e,0x727e88,0x9d8b70,0x797581];
for(let z=-110,i=0;z<70;z+=14,i++){
for(const side of [-1,1]){
const h=12+(i*7)%18;
cube(11,h,12,colors[i%4],side*18,h/2,z);
for(let y=3;y<h-1;y+=4){
for(let dz=-4;dz<=4;dz+=4){
cube(.15,2,1.6,0x364b62,side*12.45,y,z+dz);
}
}
}
}
for(let z=-100;z<55;z+=28){
for(const side of [-1,1]){
cube(.22,9,.22,0x41474b,side*10.5,4.5,z);
cube(1,.4,.8,0xe8e0ac,side*10.5,9,z);
}
}
for(let z=-90;z<20;z+=35){
cube(2,1.5,3.5,0x344f61,7,.8,z);
cube(2,1.5,3.5,0x823d34,-7,.8,z-9);
}

clock=new THREE.Clock();
buildGun();
window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
animate();
}

/* STEP 9K — FIRST PERSON WEAPON MODELS */
function buildGun(){
if(weaponModel)camera.remove(weaponModel);
weaponModel=new THREE.Group();

const wood=current==="ak";
const sniper=current==="sniper";
const body=wood?0x69472c:0x292f32;
const metal=0x14191d;
const grip=0x252525;

const length=sniper?1.35:1.05;

/* MAIN RECEIVER */
cube(.22,.24,.68,body,0,-.03,-.65,weaponModel);

/* UPPER RECEIVER */
cube(.18,.12,.56,metal,0,.12,-.72,weaponModel);

/* LONG BARREL */
cube(.085,.085,length,metal,0,.04,-1.1,weaponModel);

/* BARREL END */
cube(.13,.13,.17,0x0b0d0e,0,.04,-1.1-length/2,weaponModel);

/* HANDGUARD */
cube(.22,.19,.55,wood?0x825733:0x303a3d,0,.01,-1.1,weaponModel);

/* TOP RAIL */
cube(.12,.045,.7,0x101417,0,.19,-.85,weaponModel);

/* STOCK */
cube(.18,.19,.45,wood?0x754b2c:0x24292b,0,-.03,-.18,weaponModel);

/* PISTOL GRIP */
cube(.13,.34,.16,grip,0,-.29,-.49,weaponModel);

/* MAGAZINE */
const mag=cube(.16,.4,.19,wood?0x4a3425:0x22282c,0,-.38,-.8,weaponModel);
mag.rotation.x=wood?-.2:.08;

/* IRON SIGHTS */
cube(.09,.16,.08,metal,0,.25,-1.37,weaponModel);
cube(.12,.13,.1,metal,0,.25,-.47,weaponModel);

/* SNIPER SCOPE */
if(sniper){
cube(.17,.18,.58,0x111518,0,.31,-.75,weaponModel);
cube(.26,.25,.1,0x0c1012,0,.31,-1.04,weaponModel);
cube(.2,.2,.1,0x0c1012,0,.31,-.45,weaponModel);
}

/* HANDS AND ARMS */
const skin=0x926344;
const sleeve=0x34463d;

/* RIGHT HAND */
cube(.22,.21,.34,skin,.17,-.3,-.43,weaponModel);
cube(.28,.3,.47,sleeve,.25,-.55,-.28,weaponModel);

/* LEFT SUPPORT HAND */
cube(.23,.2,.34,skin,-.19,-.17,-1.1,weaponModel);
cube(.3,.3,.53,sleeve,-.29,-.38,-1.0,weaponModel);

/* MUZZLE LOCATION */
muzzlePoint=new THREE.Object3D();
muzzlePoint.position.set(0,.04,-1.1-length/2-.1);
weaponModel.add(muzzlePoint);

/* FIRST PERSON PLACEMENT */
weaponModel.position.set(.43,-.46,-.35);
weaponModel.rotation.y=-.08;
camera.add(weaponModel);

weaponModel.traverse(o=>{
if(o.isMesh){
o.frustumCulled=false;
o.renderOrder=3;
o.material.depthTest=false;
}
});
}

function makeSoldier(x,z,commander=false){
const group=new THREE.Group();
group.position.set(x,0,z);
const color=commander?0x593b3b:0x4c5946;
cube(.8,1.1,.5,color,0,1.4,0,group);
cube(.7,.25,.6,0x303c30,0,1.98,0,group);
ball(.3,0xbd9070,0,2.2,0,group);
cube(.7,.15,.65,0x29352d,0,2.45,0,group);
for(const side of [-1,1]){
cube(.24,.9,.28,color,side*.25,.5,0,group);
cube(.23,.75,.3,color,side*.53,1.4,0,group);
}
cube(.16,.15,.8,0x222222,0,1.5,.52,group);
const bar=cube(1,.1,.1,0x39ed55,0,2.85,0,group);
scene.add(group);
const hp=commander?280:100;
return {
group,x,z,hp,max:hp,bar,commander,
dead:false,fire:Math.random()*2,
reload:0,mag:commander?18:10,
strafe:Math.random()<.5?-1:1,move:0
};
}

function spawnWave(){
wavePending=false;
wave++;
const count=wave===1?3:wave===2?5:7;
for(let i=0;i<count;i++){
const x=(i%4-1.5)*4.3;
const z=player.z-25-Math.floor(i/4)*11-Math.random()*6;
soldiers.push(makeSoldier(x,Math.max(-106,z),wave>1&&i===count-1));
}
$("mission").textContent="WAVE "+wave+" / 3 — ELIMINATE ENEMIES";
message("WAVE "+wave+" INCOMING");
updateHUD();
}
function updateHUD(){
$("kills").textContent=kills;
$("enemies").textContent=soldiers.filter(e=>!e.dead).length;
$("grenades").textContent=grenades;
$("hp").textContent=Math.ceil(player.hp);
$("weapon").textContent=specs[current].name;
$("ammo").textContent=guns[current].mag+"/"+guns[current].reserve;
}
function setAim(v){
aiming=v;
camera.fov=aiming?(current==="sniper"?23:54):74;
camera.updateProjectionMatrix();
$("scope").style.display=aiming&&current==="sniper"?"flex":"none";
$("cross").style.display=aiming&&current==="sniper"?"none":"block";
}
function switchGun(name){
if(!playing)return;
current=name;
reloadTime=0;
setAim(false);
buildGun();
document.querySelectorAll("#guns button").forEach(b=>
b.classList.toggle("active",b.dataset.gun===name));
sound(350,.07);
updateHUD();
}
function reload(){
if(!playing||reloadTime)return;
const g=guns[current],s=specs[current];
if(g.mag>=s.size||g.reserve<=0)return;
reloadTime=performance.now()+(current==="sniper"?1900:1450);
message("RELOADING");
sound(400,.15);
}

/* VISIBLE BULLET TRACERS */
function bulletTracer(start,end,color=0xffee55,duration=220){
const direction=new THREE.Vector3().subVectors(end,start);
const distance=direction.length();
if(distance<.01)return;
const geometry=new THREE.CylinderGeometry(.035,.065,distance,6);
const material=new THREE.MeshBasicMaterial({
color,transparent:true,opacity:1,
depthTest:false,depthWrite:false
});
const tracer=new THREE.Mesh(geometry,material);
tracer.renderOrder=5;
tracer.position.copy(start).add(end).multiplyScalar(.5);
tracer.quaternion.setFromUnitVectors(
new THREE.Vector3(0,1,0),direction.normalize()
);
scene.add(tracer);
effects.push({
mesh:tracer,start:performance.now(),duration,
update(t){
material.opacity=1-t;
return t<1;
}
});
}

function muzzleFlash(position,color=0xffbb22){
const flash=new THREE.Mesh(
new THREE.SphereGeometry(.24,8,6),
new THREE.MeshBasicMaterial({
color,transparent:true,opacity:1,
depthTest:false
})
);
flash.position.copy(position);
flash.renderOrder=6;
scene.add(flash);
effects.push({
mesh:flash,start:performance.now(),duration:100,
update(t){
flash.scale.setScalar(1+t*2);
flash.material.opacity=1-t;
return t<1;
}
});
}

function impactSparks(position){
for(let i=0;i<5;i++){
const spark=new THREE.Mesh(
new THREE.SphereGeometry(.055,6,4),
new THREE.MeshBasicMaterial({
color:0xffcc55,transparent:true,opacity:1
})
);
spark.position.copy(position);
scene.add(spark);
const velocity=new THREE.Vector3(
(Math.random()-.5)*4,
Math.random()*3,
(Math.random()-.5)*4
);
effects.push({
mesh:spark,start:performance.now(),duration:260,
update(t){
spark.position.copy(position).addScaledVector(velocity,t);
spark.material.opacity=1-t;
return t<1;
}
});
}
}

function damageEnemy(e,amount,headshot=false){
if(e.dead)return;
e.hp-=amount;
e.bar.scale.x=Math.max(0,e.hp/e.max);
if(headshot)message("HEADSHOT!");
if(e.hp<=0){
e.dead=true;
scene.remove(e.group);
kills++;
if(kills%3===0){
dropItem(e.x,e.z,Math.random()<.5?"health":"ammo");
}
if(soldiers.every(s=>s.dead)&&!wavePending){
wavePending=true;
if(wave<3){
const oldSession=session;
setTimeout(()=>{
if(playing&&session===oldSession)spawnWave();
},1600);
}else makeCheckpoint();
}
}
updateHUD();
}

function fire(){
if(!playing||reloadTime)return;
const now=performance.now();
const s=specs[current],g=guns[current];
if(now-lastShot<s.rate)return;
lastShot=now;
if(g.mag<=0){sound(100,.06);reload();return;}
g.mag--;

sound(current==="sniper"?90:current==="ak"?120:165,
current==="sniper"?.25:.12,.09);

recoil=.15;

const direction=new THREE.Vector3();
camera.getWorldDirection(direction);
const spread=s.spread*(aiming?.3:1);
direction.x+=(Math.random()-.5)*spread;
direction.y+=(Math.random()-.5)*spread;
direction.normalize();

const ray=new THREE.Ray(camera.position.clone(),direction);
let target=null,closest=s.range,head=false;

for(const e of soldiers){
if(e.dead)continue;
const center=new THREE.Vector3(e.x,1.5,e.z);
const t=center.sub(camera.position).dot(direction);
if(t<=0||t>=closest)continue;
const point=ray.at(t,new THREE.Vector3());
if(Math.abs(point.x-e.x)<.55 &&
Math.abs(point.z-e.z)<.65 &&
point.y>.3&&point.y<2.6){
closest=t;target=e;
head=point.y>1.95;
}
}

camera.updateMatrixWorld(true);
const muzzle=new THREE.Vector3();
muzzlePoint.getWorldPosition(muzzle);
const end=camera.position.clone().add(
direction.clone().multiplyScalar(target?closest:Math.min(s.range,65))
);

bulletTracer(muzzle,end,
current==="sniper"?0xff9922:0xffee55,
current==="sniper"?320:210);
muzzleFlash(muzzle);

if(target){
damageEnemy(target,s.damage*(head?2.3:1),head);
impactSparks(end);
}
updateHUD();
}

function dropItem(x,z,type){
const group=new THREE.Group();
cube(.8,.35,.8,type==="health"?0x24e45d:0xe6bc37,0,.4,0,group);
if(type==="health"){
cube(.15,.04,.5,0xffffff,0,.62,0,group);
cube(.5,.04,.15,0xffffff,0,.63,0,group);
}
group.position.set(x,0,z);
scene.add(group);
items.push({group,x,z,type});
}

function throwGrenade(){
if(!playing||grenades<=0)return;
grenades--;updateHUD();sound(260,.12);
const direction=new THREE.Vector3();
camera.getWorldDirection(direction);
const sx=player.x,sz=player.z;
const tx=Math.max(-8,Math.min(8,sx+direction.x*12));
const tz=Math.max(-107,Math.min(55,sz+direction.z*12));
const orb=ball(.28,0x36513b,sx,1.5,sz);
effects.push({
mesh:orb,start:performance.now(),duration:700,
update(t){
orb.position.set(
sx+(tx-sx)*t,
1.5+3*Math.sin(Math.PI*t),
sz+(tz-sz)*t
);
if(t>=1){explode(tx,tz);return false;}
return true;
}
});
}
function explode(x,z){
sound(65,.45,.18);
const blast=new THREE.Mesh(
new THREE.SphereGeometry(2.2,12,8),
new THREE.MeshBasicMaterial({
color:0xffa42c,transparent:true,opacity:1
})
);
blast.position.set(x,1,z);
scene.add(blast);
effects.push({
mesh:blast,start:performance.now(),duration:350,
update(t){
blast.scale.setScalar(1+t*1.7);
blast.material.opacity=1-t;
return t<1;
}
});
for(const e of soldiers){
if(e.dead)continue;
const dist=Math.hypot(e.x-x,e.z-z);
if(dist<7)damageEnemy(e,Math.max(50,170-dist*18));
}
}

function makeCheckpoint(){
if(checkpoint)return;
checkpoint=new THREE.Group();
const base=new THREE.Mesh(
new THREE.CylinderGeometry(2.2,2.2,.1,20),
new THREE.MeshBasicMaterial({color:0x32ff77})
);
base.position.y=.12;
checkpoint.add(base);
const beam=new THREE.Mesh(
new THREE.CylinderGeometry(1.4,1.4,7,16,1,true),
new THREE.MeshBasicMaterial({
color:0x36ff80,transparent:true,opacity:.2,
side:THREE.DoubleSide
})
);
beam.position.y=3.5;
checkpoint.add(beam);
checkpoint.position.set(0,0,Math.max(-105,player.z-13));
scene.add(checkpoint);
$("mission").textContent="REACH THE GREEN CHECKPOINT";
message("ALL WAVES CLEARED!");
}
function endGame(win){
playing=false;firing=false;
$("finish").style.display="flex";
$("result").textContent=win?"MISSION COMPLETE":"MISSION FAILED";
$("score").textContent="TOTAL ELIMINATIONS: "+kills;
}
function reset(){
session++;
soldiers.forEach(e=>scene.remove(e.group));
items.forEach(e=>scene.remove(e.group));
effects.forEach(e=>scene.remove(e.mesh));
if(checkpoint)scene.remove(checkpoint);
soldiers=[];items=[];effects=[];
checkpoint=null;wavePending=false;
player={x:0,z:15,hp:100};
yaw=0;pitch=0;wave=0;kills=0;grenades=3;
current="m4";lastShot=0;reloadTime=0;
recoil=0;walkTime=0;
guns={
m4:{mag:30,reserve:180},
ak:{mag:30,reserve:150},
sniper:{mag:5,reserve:30}
};
setAim(false);
buildGun();
playing=true;firing=false;
$("start").style.display="none";
$("finish").style.display="none";
document.querySelectorAll("#guns button").forEach(b=>
b.classList.toggle("active",b.dataset.gun==="m4"));
spawnWave();updateHUD();
}

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.05);
const now=performance.now();

if(playing){
if(reloadTime&&now>=reloadTime){
const g=guns[current],s=specs[current];
const amount=Math.min(s.size-g.mag,g.reserve);
g.mag+=amount;g.reserve-=amount;
reloadTime=0;
sound(520,.1);
updateHUD();
}
if(firing)fire();

let mx=joy.x+(keys.KeyD?1:0)-(keys.KeyA?1:0);
let my=-joy.y+(keys.KeyW?1:0)-(keys.KeyS?1:0);
const length=Math.max(1,Math.hypot(mx,my));
mx/=length;my/=length;
const speed=aiming?3.2:6.2;

player.x+=(Math.cos(yaw)*mx-Math.sin(yaw)*my)*speed*dt;
player.z+=(-Math.sin(yaw)*mx-Math.cos(yaw)*my)*speed*dt;
player.x=Math.max(-8.5,Math.min(8.5,player.x));
player.z=Math.max(-108,Math.min(57,player.z));
camera.position.set(player.x,1.75,player.z);
camera.rotation.set(pitch,yaw,0);

/* WEAPON BOB, RECOIL AND RELOAD ANIMATION */
recoil=Math.max(0,recoil-dt*.85);
const moving=Math.hypot(mx,my)>.1;
if(moving)walkTime+=dt*10;
const bob=moving?Math.sin(walkTime)*.018:0;
const reloading=reloadTime>0;
const reloadProgress=reloading?
1-Math.max(0,reloadTime-now)/(current==="sniper"?1900:1450):0;
const reloadDip=reloading?Math.sin(reloadProgress*Math.PI)*.3:0;

if(weaponModel){
weaponModel.position.set(
aiming?.18:.43,
(aiming?-.32:-.46)+bob-reloadDip-recoil*.3,
aiming?-.23:-.35
);
weaponModel.rotation.x=recoil*.6+reloadDip*.7;
weaponModel.rotation.y=aiming?0:-.08;
weaponModel.visible=!(aiming&&current==="sniper");
}

for(const e of soldiers){
if(e.dead)continue;
const dx=player.x-e.x,dz=player.z-e.z;
const dist=Math.max(.01,Math.hypot(dx,dz));
e.group.rotation.y=Math.atan2(dx,dz);

if(dist>11&&dist<65){
const speed=(e.commander?1.7:1.3)*dt;
e.x+=dx/dist*speed;
e.z+=dz/dist*speed;
}else if(dist<5){
e.x-=dx/dist*2*dt;
e.z-=dz/dist*2*dt;
}
e.move+=dt;
if(e.move>1.8){e.move=0;e.strafe*=-1;}
e.x+=e.strafe*dt*.5;
e.x=Math.max(-8,Math.min(8,e.x));
e.group.position.set(e.x,0,e.z);

if(e.reload>0){e.reload-=dt;continue;}
e.fire-=dt;
if(dist<45&&e.fire<=0){
e.fire=(e.commander?.6:1.2)+Math.random()*.6;
e.mag--;
sound(85,.08,.012);

const enemyStart=new THREE.Vector3(e.x,1.5,e.z);
const playerEnd=camera.position.clone();
playerEnd.x+=(Math.random()-.5)*1.8;
playerEnd.y+=(Math.random()-.5)*1.1;
bulletTracer(enemyStart,playerEnd,0xff3030,250);
muzzleFlash(enemyStart,0xff5522);

if(e.mag<=0){
e.reload=2.2;
e.mag=e.commander?18:10;
}
if(Math.random()<Math.max(.08,.65-dist*.012)){
player.hp-=e.commander?9:6;
$("damage").style.opacity=.25;
setTimeout(()=>$("damage").style.opacity=0,110);
if(player.hp<=0){
player.hp=0;
endGame(false);
}
}
updateHUD();
}
}

for(let i=items.length-1;i>=0;i--){
const p=items[i];
p.group.rotation.y+=dt*2;
if(Math.hypot(p.x-player.x,p.z-player.z)<1.7){
if(p.type==="health"){
player.hp=Math.min(100,player.hp+35);
message("HEALTH +35");
}else{
guns.m4.reserve+=45;
guns.ak.reserve+=45;
guns.sniper.reserve+=8;
message("AMMO RESTOCKED");
}
scene.remove(p.group);
items.splice(i,1);
updateHUD();
}
}
if(checkpoint&&Math.hypot(
checkpoint.position.x-player.x,
checkpoint.position.z-player.z
)<2.4)endGame(true);
}

for(let i=effects.length-1;i>=0;i--){
const e=effects[i];
const t=Math.min(1,(now-e.start)/e.duration);
if(!e.update(t)){
scene.remove(e.mesh);
if(e.mesh.geometry)e.mesh.geometry.dispose();
if(e.mesh.material)e.mesh.material.dispose();
effects.splice(i,1);
}
}
renderer.render(scene,camera);
}

/* IPHONE JOYSTICK */
const stick=$("joy");
let stickId=null;
function moveStick(e){
const r=stick.getBoundingClientRect();
const dx=e.clientX-r.left-r.width/2;
const dy=e.clientY-r.top-r.height/2;
const limit=r.width*.32;
const len=Math.max(1,Math.hypot(dx,dy));
joy.x=Math.max(-1,Math.min(1,dx/limit));
joy.y=Math.max(-1,Math.min(1,dy/limit));
const factor=Math.min(limit,len)/len;
$("knob").style.transform=
`translate(${dx*factor}px,${dy*factor}px)`;
}
stick.addEventListener("pointerdown",e=>{
e.preventDefault();
stickId=e.pointerId;
stick.setPointerCapture(e.pointerId);
moveStick(e);
});
stick.addEventListener("pointermove",e=>{
if(e.pointerId===stickId)moveStick(e);
});
function stopStick(e){
if(e.pointerId!==stickId)return;
stickId=null;joy={x:0,y:0};
$("knob").style.transform="";
}
stick.addEventListener("pointerup",stopStick);
stick.addEventListener("pointercancel",stopStick);

/* DRAG TO LOOK */
let lookId=null,lookX=0,lookY=0;
window.addEventListener("pointerdown",e=>{
if(e.target!==renderer.domElement)return;
lookId=e.pointerId;
lookX=e.clientX;lookY=e.clientY;
});
window.addEventListener("pointermove",e=>{
if(e.pointerId!==lookId||!playing)return;
yaw-=(e.clientX-lookX)*.004;
pitch=Math.max(-1.2,Math.min(1.2,
pitch-(e.clientY-lookY)*.0035));
lookX=e.clientX;lookY=e.clientY;
});
window.addEventListener("pointerup",e=>{
if(e.pointerId===lookId)lookId=null;
});
window.addEventListener("pointercancel",e=>{
if(e.pointerId===lookId)lookId=null;
});

function control(id,down,up=()=>{}){
const el=$(id);
el.addEventListener("pointerdown",e=>{
e.preventDefault();
el.setPointerCapture(e.pointerId);
down();
});
el.addEventListener("pointerup",up);
el.addEventListener("pointercancel",up);
}
control("fire",()=>{
firing=true;fire();
},()=>firing=false);
control("aim",()=>setAim(!aiming));
control("reload",reload);
control("grenade",throwGrenade);

document.querySelectorAll("#guns button").forEach(b=>
b.addEventListener("click",()=>switchGun(b.dataset.gun)));

$("sound").onclick=()=>{
soundOn=!soundOn;
$("sound").textContent=soundOn?"SOUND ON":"SOUND OFF";
};
$("test").onclick=()=>sound(600,.25,.12);
$("play").onclick=reset;
$("restart").onclick=reset;

window.addEventListener("keydown",e=>{
keys[e.code]=true;
if(e.code==="Space")fire();
if(e.code==="KeyR")reload();
if(e.code==="KeyG")throwGrenade();
if(e.code==="Digit1")switchGun("m4");
if(e.code==="Digit2")switchGun("ak");
if(e.code==="Digit3")switchGun("sniper");
});
window.addEventListener("keyup",e=>keys[e.code]=false);
document.addEventListener("contextmenu",e=>e.preventDefault());

setup();
</script>
</body>
