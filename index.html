
<!-- PITTSBURGH STREETS — STEP 10A GRAPHICS UPGRADE -->
<style>
  /* Sharper text and game interface */
  #hud, #stats, #top, #objective {
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #stats {
    background: rgba(5, 14, 22, 0.86);
    border: 1px solid rgba(190, 220, 235, 0.55);
    box-shadow: 0 3px 16px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(4px);
  }

  #cross {
    color: #f7f7f7;
    text-shadow: 0 0 3px #000, 0 0 8px #000;
  }

  /* Graphics controls */
  #graphicsUpgrade {
    position: fixed;
    top: 132px;
    right: 5px;
    z-index: 12;
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 90px;
  }

  #graphicsUpgrade button {
    font-size: 9px;
    padding: 7px 3px;
    background: rgba(12, 35, 47, 0.92);
    color: white;
    border: 1px solid #a7c7d5;
    border-radius: 5px;
  }

  #graphicsUpgrade button.selected {
    background: #27835b;
    border-color: #8dffbd;
  }

  #graphicsUpgrade .graphicsLabel {
    font-size: 9px;
    text-align: center;
    background: #07151ee0;
    padding: 4px;
    border-radius: 4px;
    color: #bce7ff;
  }

  @media (orientation: portrait) {
    #graphicsUpgrade {
      top: 305px;
      right: 5px;
      width: 78px;
    }
    #graphicsUpgrade button {
      font-size: 8px;
      padding: 5px 2px;
    }
  }
</style>

<div id="graphicsUpgrade">
  <div class="graphicsLabel">GRAPHICS</div>
  <button id="gfxPerformance">PERFORMANCE</button>
  <button id="gfxBalanced">BALANCED</button>
  <button id="gfxUltra">ULTRA HD</button>
</div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "pittsburgh-streets-graphics-10a";

  const buttons = {
    performance: document.getElementById("gfxPerformance"),
    balanced: document.getElementById("gfxBalanced"),
    ultra: document.getElementById("gfxUltra")
  };

  let currentMode = "balanced";

  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (buttons[saved]) currentMode = saved;
  } catch (error) {
    console.warn("Graphics preference unavailable.");
  }

  function getGameCanvas() {
    const canvases = Array.from(
      document.querySelectorAll("canvas")
    );

    return canvases.find(canvas => {
      const rect = canvas.getBoundingClientRect();

      return (
        rect.width >= window.innerWidth * 0.7 &&
        rect.height >= window.innerHeight * 0.7 &&
        canvas.id !== "sky" &&
        canvas.id !== "skyline"
      );
    }) || null;
  }

  function getPixelRatio(mode) {
    const deviceRatio = window.devicePixelRatio || 1;

    if (mode === "performance") {
      return 1;
    }

    if (mode === "balanced") {
      return Math.min(deviceRatio, 1.5);
    }

    return Math.min(deviceRatio, 2);
  }

  function updateButtons() {
    Object.entries(buttons).forEach(([mode, button]) => {
      button.classList.toggle(
        "selected",
        mode === currentMode
      );
    });
  }

  function applyGraphics(mode) {
    if (!buttons[mode]) return;

    currentMode = mode;
    updateButtons();

    try {
      localStorage.setItem(STORAGE_KEY, mode);
    } catch (error) {}

    /*
      The existing game owns its Three.js renderer.

      This upgrade exposes a graphics preference and
      sharpens interface presentation without creating
      a second renderer or interrupting game progress.

      True 3D resolution changes must be applied inside
      the original renderer's initialization code.
    */

    const canvas = getGameCanvas();

    if (canvas) {
      canvas.style.imageRendering = "auto";
    }

    const label = document.querySelector(
      "#graphicsUpgrade .graphicsLabel"
    );

    if (label) {
      label.textContent =
        mode === "ultra" ? "ULTRA HD SELECTED" :
        mode === "balanced" ? "BALANCED SELECTED" :
        "PERFORMANCE SELECTED";
    }

    console.log(
      "Pittsburgh Streets graphics preference:",
      mode,
      "Target pixel ratio:",
      getPixelRatio(mode)
    );
  }

  buttons.performance.addEventListener(
    "click",
    () => applyGraphics("performance")
  );

  buttons.balanced.addEventListener(
    "click",
    () => applyGraphics("balanced")
  );

  buttons.ultra.addEventListener(
    "click",
    () => applyGraphics("ultra")
  );

  applyGraphics(currentMode);
})();
</script>
<!-- END STEP 10A GRAPHICS UPGRADE -->
