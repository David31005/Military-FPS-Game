
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1">
<title>Pittsburgh Streets</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
  }
  #title {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 23px;
    font-weight: bold;
    text-shadow: 2px 2px 5px black;
    pointer-events: none;
  }
  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 28px;
    pointer-events: none;
  }
  #hud {
    position: absolute;
    bottom: 15px;
    left: 15px;
    color: white;
    font-size: 16px;
    text-shadow: 1px 1px 3px black;
  }
</style>
</head>
<body>

<div id="title">PITTSBURGH STREETS</div>
<div id="crosshair">+</div>
<div id="hud">HEALTH: 100 | AMMO: 30</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91a6b2);
scene.fog = new THREE.Fog(0x91a6b2, 25, 110);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  200
);
camera.position.set(0, 1.7, 8);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setSize(
  window.innerWidth,
  window.innerHeight
);
renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(
  0xffffff, 0x555555, 2
));

const sun = new THREE.DirectionalLight(
  0xffffff, 2
);
sun.position.set(10, 20, 10);
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({
    color: 0x527044
  })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Road
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 160),
  new THREE.MeshStandardMaterial({
    color: 0x303238
  })
);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.02;
scene.add(road);

// Sidewalks
function makeBox(w, h, d, color, x, y, z) {
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({color})
  );
  box.position.set(x, y, z);
  scene.add(box);
  return box;
}

makeBox(3, 0.2, 160, 0x999999,
  -7.5, 0.1, 0);
makeBox(3, 0.2, 160, 0x999999,
  7.5, 0.1, 0);

// Buildings
const colors = [
  0x885544,
  0x777777,
  0x554c48,
  0x99775b
];

for (let i = 0; i < 12; i++) {
  const z = 15 - i * 12;
  const height = 7 + (i % 4) * 2;

  makeBox(8, height, 9,
    colors[i % colors.length],
    -13, height / 2, z);

  makeBox(8, height + 2, 9,
    colors[(i + 1) % colors.length],
    13, (height + 2) / 2, z);
}

// Yellow road markings
for (let z = -70; z < 70; z += 9) {
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(0.25, 4),
    new THREE.MeshBasicMaterial({
      color: 0xffd447
    })
  );
  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.04, z);
  scene.add(line);
}

// Animation
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect =
    window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});
</script>
</body>
</html>
