<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

// SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87a9c4);
scene.fog=new THREE.Fog(0x87a9c4,55,140);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,250);

camera.rotation.order="YXZ";

const renderer=new THREE.WebGLRenderer({antialias:true});

renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.domElement.style.cssText="position:absolute;inset:0;z-index:0";
document.body.insertBefore(renderer.domElement,document.body.firstChild);

function box(parent,w,h,d,color,x,y,z){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshBasicMaterial({color})
 );
 m.position.set(x,y,z);
 parent.add(m);

}

);
road.rotation.x=-Math.PI/2;
road.position.y=.025;

box(scene,3,.2,180,0x999999,-7.5,.1,0);
box(scene,3,.2,180,0x999999,7.5,.1,0);

for(let i=0;i<12;i++){

 box(scene,8,h,9,colors[i%4],-13,h/2,z);

}
for(let z=-75;z<75;z+=9){

);

// COLLISION
const obstacles=[],solidMeshes=[],barriers=[];
function registerObstacle(x,z,w,d){obstacles.push({x,z,w,d});}
function solid(m){solidMeshes.push(m);return m;}
function collides(x,z,r=.35){
 return obstacles.some(o=>
  Math.abs(x-o.x)<o.w/2+r&&
  Math.abs(z-o.z)<o.d/2+r
 );
}
function addBarrier(x,z){
 const m=solid(box(scene,2.3,1.25,.85,0x999b9b,x,.625,z));
 solid(box(scene,2.38,.14,.95,0xc1c3c3,x,1.3,z));
 barriers.push({x,z,mesh:m});
 registerObstacle(x,z,2.3,.85);
}

addBarrier(3.9,-26);
addBarrier(-3.9,-38);
addBarrier(3.9,-50);
addBarrier(-3.9,-64);

// VEHICLES

  new THREE.CylinderGeometry(.43,.43,.24,12),
  new THREE.MeshBasicMaterial({color:0x151515})
 );
 tire.rotation.z=Math.PI/2;
 tire.position.set(x,y,z);
 parent.add(tire);
 solid(tire);
 const hub=new THREE.Mesh(
  new THREE.CylinderGeometry(.18,.18,.26,12),
  new THREE.MeshBasicMaterial({color:0x555555})
 );

 hub.position.set(x,y,z);

}
function humvee(x,z){
 const v=new THREE.Group();
 v.position.set(x,0,z);
 scene.add(v);
 solid(box(v,2.2,.85,4.1,0x48583a,0,1.05,0));
 solid(box(v,2.05,.8,2.15,0x48583a,0,1.82,.25));
 box(v,1.85,.42,.08,0x25302b,0,1.92,-.88);
 box(v,.08,.4,1.3,0x25302b,-1.05,1.95,.3);
 box(v,.08,.4,1.3,0x25302b,1.05,1.95,.3);
 box(v,2.25,.28,.25,0x333333,0,.72,-2.1);
 box(v,2.25,.28,.25,0x333333,0,.72,2.1);
 box(v,.45,.22,.08,0xffe1a3,-.7,1.05,-2.1);
 box(v,.45,.22,.08,0xffe1a3,.7,1.05,-2.1);
 for(const s of [-1,1])
  for(const wz of [-1.35,1.35])
   wheel(v,s*1.12,.5,wz);
 solid(box(v,.85,.24,.85,0x303b2d,0,2.38,.25));
 box(v,.17,.16,1.2,0x151515,0,2.42,-.65);
 registerObstacle(x,z,2.5,4.4);
}
function transportTruck(x,z){
 const t=new THREE.Group();
 t.position.set(x,0,z);
 scene.add(t);
 solid(box(t,2.4,.65,6.5,0x252525,0,.9,0));
 solid(box(t,2.3,1.55,2,0x536247,0,1.75,-2.15));
 solid(box(t,2.35,1.65,3.8,0x6c7056,0,1.95,1.2));
 box(t,2.05,.55,.08,0x273f43,0,2.05,-3.18);
 box(t,.12,.55,.9,0x273f43,-1.18,2,-2.2);
 box(t,.12,.55,.9,0x273f43,1.18,2,-2.2);
 box(t,.45,.2,.08,0xffe4a1,-.75,1.2,-3.3);
 box(t,.45,.2,.08,0xffe4a1,.75,1.2,-3.3);
 for(const s of [-1,1])
  for(const wz of [-2.25,.6,2.15])

const checkpoint=new THREE.Group();
checkpoint.position.set(0,0,-55);

box(checkpoint,2,1.2,1,0x888888,-4,.6,0);
box(checkpoint,2,1.2,1,0x888888,4,.6,0);
box(checkpoint,1.5,3,1.5,0x4c5b42,-6,1.5,0);
box(checkpoint,1.5,3,1.5,0x4c5b42,6,1.5,0);
box(checkpoint,14,.5,.7,0x303030,0,4,0);
const marker=new THREE.Mesh(
 new THREE.CylinderGeometry(1.2,1.2,.12,32),

);
marker.position.set(0,.15,-4);

// ENEMIES
const enemies=[],targets=[];

function createHealthBar(s){
 const g=new THREE.Group();
 g.position.set(0,3.1,0);
 const bg=new THREE.Mesh(
  new THREE.PlaneGeometry(1.2,.16),
  new THREE.MeshBasicMaterial({
   color:0x333333,side:THREE.DoubleSide,depthTest:false
  })
 );
 const fill=new THREE.Mesh(
  new THREE.PlaneGeometry(1.1,.1),
  new THREE.MeshBasicMaterial({
   color:0x00ff00,side:THREE.DoubleSide,depthTest:false
  })
 );
 fill.position.z=.01;
 g.add(bg,fill);
 s.add(g);
 s.userData.healthBar=g;
 s.userData.healthFill=fill;
}
function updateHealthBar(s){
 const d=s.userData,f=d.healthFill;
 const p=Math.max(0,d.health/100);
 f.scale.x=Math.max(.001,p);
 f.position.x=-1.1*(1-p)/2;
 f.material.color.setHex(
  p>.5?0x00ff00:p>.25?0xffaa00:0xff0000
 );
}

function createEnemy(x,z){
 const s=new THREE.Group();
 s.position.set(x,0,z);
 function part(w,h,d,c,px,py,pz){
  const m=box(s,w,h,d,c,px,py,pz);
  m.userData.enemy=s;
  targets.push(m);
 }
 part(.35,.8,.4,0x252a25,-.24,.4,0);
 part(.35,.8,.4,0x252a25,.24,.4,0);
 part(1,1.1,.55,0x42543b,0,1.35,0);
 part(.3,.9,.4,0x42543b,-.65,1.4,0);
 part(.3,.9,.4,0x42543b,.65,1.4,0);
 part(.55,.55,.5,0x9a7255,0,2.15,0);
 part(.75,.25,.7,0x303e2b,0,2.5,0);
 part(.45,.45,.04,0xff3333,0,1.4,.3);

 const rifle=new THREE.Group();
 rifle.position.set(.3,1.5,.45);
 box(rifle,.17,.2,.8,0x181818,0,0,.1);
 box(rifle,.09,.09,.85,0x111111,0,.05,.85);
 box(rifle,.13,.3,.17,0x382d24,0,-.22,-.12);
 box(rifle,.1,.12,.14,0x222222,0,.17,.25);
 s.add(rifle);

 // BRIGHT ENEMY MUZZLE FLASH
 const flash=new THREE.Group();
 const core=new THREE.Mesh(
  new THREE.SphereGeometry(.35,10,10),
  new THREE.MeshBasicMaterial({
   color:0xffff44,depthTest:false
  })
 );
 const burst=new THREE.Mesh(
  new THREE.ConeGeometry(.28,.85,8),
  new THREE.MeshBasicMaterial({
   color:0xffaa00,depthTest:false
  })
 );
 burst.rotation.x=Math.PI/2;
 burst.position.z=.4;
 flash.add(core,burst);
 flash.position.set(0,.05,1.35);
 flash.visible=false;
 rifle.add(flash);

 s.userData={
  health:100,alive:true,homeX:x,homeZ:z,
  phase:Math.random()*Math.PI*2,
  cooldown:2,respawn:0,mode:"patrol",
  coverTimer:0,coverPoint:null,
  rifle,flash,flashTime:0
 };
 createHealthBar(s);
 updateHealthBar(s);
 scene.add(s);
 enemies.push(s);

createEnemy(-3,-12);
createEnemy(3,-23);

// IPHONE JOYSTICK
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let moveX=0,moveY=0,joyId=null;

function updateStick(e){
 const r=joystick.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const d=Math.hypot(x,y),max=37;
 if(d>max){x=x/d*max;y=y/d*max;}
 moveX=x/max;
 moveY=y/max;
 stick.style.transform=`translate(${x}px,${y}px)`;
}
joystick.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(joyId!==null)return;
 joyId=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 updateStick(e);
});
joystick.addEventListener("pointermove",e=>{
 if(e.pointerId===joyId)updateStick(e);
});
function stopStick(e){
 if(e.pointerId!==joyId)return;
 joyId=null;
 moveX=0;moveY=0;
 stick.style.transform="translate(0px,0px)";
}
joystick.addEventListener("pointerup",stopStick);
joystick.addEventListener("pointercancel",stopStick);

// TOUCH CAMERA
let lookId=null,lastX=0,lastY=0;
let yaw=0,pitch=0,aiming=false,aimId=null;

renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.clientX<innerWidth*.35||lookId!==null)return;
 lookId=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId!==lookId)return;
 const sensitivity=aiming?.002:.004;
 yaw-=(e.clientX-lastX)*sensitivity;
 pitch-=(e.clientY-lastY)*sensitivity;
 pitch=THREE.MathUtils.clamp(pitch,-1.2,1.2);
 lastX=e.clientX;
 lastY=e.clientY;
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
});
function stopLook(e){
 if(e.pointerId===lookId)lookId=null;
}
renderer.domElement.addEventListener("pointerup",stopLook);
renderer.domElement.addEventListener("pointercancel",stopLook);

// IPHONE AUDIO SYSTEM
let audioContext=null;
let soundEnabled=true;
const soundButton=document.getElementById("sound");
const soundStatus=document.getElementById("soundStatus");

function unlockAudio(){
 if(!soundEnabled)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){
   soundStatus.textContent="Audio unavailable";
   return;
  }
  if(!audioContext)audioContext=new AC();
  if(audioContext.state==="suspended"){
   audioContext.resume().then(()=>{
    soundStatus.textContent="Audio ready";
   }).catch(()=>{
    soundStatus.textContent="Audio blocked";
   });
  }else{
   soundStatus.textContent="Audio ready";
  }
 }catch(e){
  soundStatus.textContent="Audio error";
 }
}

function tone(freq,duration,type="sine",volume=.2,slide=0){
 if(!soundEnabled||!audioContext)return;
 try{
  const ctx=audioContext,now=ctx.currentTime;
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(Math.max(25,freq),now);
  osc.frequency.exponentialRampToValueAtTime(
   Math.max(25,freq+slide),now+duration
  );
  gain.gain.setValueAtTime(volume,now);
  gain.gain.exponentialRampToValueAtTime(.001,now+duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now+duration);
 }catch(e){}
}

function noise(duration=.15,volume=.25){
 if(!soundEnabled||!audioContext)return;
 try{
  const ctx=audioContext;
  const length=Math.floor(ctx.sampleRate*duration);
  const buffer=ctx.createBuffer(1,length,ctx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<length;i++){
   data[i]=(Math.random()*2-1)*(1-i/length);
  }
  const source=ctx.createBufferSource();
  source.buffer=buffer;
  const filter=ctx.createBiquadFilter();
  filter.type="lowpass";
  filter.frequency.value=1800;
  const gain=ctx.createGain();
  gain.gain.value=volume;
  source.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  source.start();
 }catch(e){}
}
function playerGunSound(){
 noise(.18,.32);
 tone(135,.17,"sawtooth",.2,-100);
}
function enemyGunSound(distance){

 soundButton.textContent="SOUND: ON";

const hitmarker=document.getElementById("hitmarker");
let hitmarkerTimer;
function showHitmarker(kill=false){
 hitmarker.textContent="×";
 hitmarker.style.color=kill?"#ff3333":"#ffffff";
 hitmarker.style.display="block";
 clearTimeout(hitmarkerTimer);
 hitmarkerTimer=setTimeout(()=>{
  hitmarker.style.display="none";
 },180);
}
const impactEffects=[];
function createImpact(point){
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(.18,8,8),
  new THREE.MeshBasicMaterial({
   color:0xffcc33,transparent:true,opacity:1,depthTest:false
  })
 );
 m.position.copy(point);
 scene.add(m);
 impactEffects.push({mesh:m,life:.25});
}

// BRIGHT YELLOW BULLET TRACERS
const tracers=[];
function createTracer(start,end){
 const dir=new THREE.Vector3().subVectors(end,start);
 const length=dir.length();
 if(length<.01)return;
 const m=new THREE.Mesh(
  new THREE.CylinderGeometry(.07,.07,length,7),
  new THREE.MeshBasicMaterial({
   color:0xffe84d,transparent:true,opacity:1,depthTest:false
  })
 );
 m.position.copy(start).add(end).multiplyScalar(.5);
 m.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,1,0),dir.normalize()
 );
 m.renderOrder=8;
 scene.add(m);
 tracers.push({mesh:m,life:.55});
}

// ENEMY COVER
function findCover(enemy){
 let best=null,bestDistance=Infinity;
 for(const b of barriers){
  const distance=Math.hypot(
   enemy.position.x-b.x,
   enemy.position.z-b.z
  );
  if(distance>13)continue;
  const ax=b.x-camera.position.x;
  const az=b.z-camera.position.z;
  const len=Math.hypot(ax,az)||1;
  const x=THREE.MathUtils.clamp(b.x+ax/len*1.65,-5.3,5.3);
  const z=b.z+az/len*1.65;
  if(collides(x,z,.4))continue;
  const travel=Math.hypot(
   enemy.position.x-x,enemy.position.z-z
  );
  if(travel<bestDistance){
   bestDistance=travel;
   best={x,z,barrier:b};
  }
 }
 return best;
}

// ENEMY OBSTACLE NAVIGATION
function moveToward(enemy,x,z,speed,dt){
 const dx=x-enemy.position.x;
 const dz=z-enemy.position.z;
 const distance=Math.hypot(dx,dz);
 if(distance<.08)return distance;

 const step=Math.min(distance,speed*dt);
 const dirX=dx/distance,dirZ=dz/distance;
 const oldX=enemy.position.x,oldZ=enemy.position.z;
 const nx=oldX+dirX*step,nz=oldZ+dirZ*step;

 if(!collides(nx,nz,.4)){
  enemy.position.x=nx;
  enemy.position.z=nz;
  return distance;
 }
 if(!collides(nx,oldZ,.4)){
  enemy.position.x=nx;
  return distance;
 }
 if(!collides(oldX,nz,.4)){
  enemy.position.z=nz;
  return distance;
 }

 const sides=[
  {x:-dirZ,z:dirX},
  {x:dirZ,z:-dirX}
 ];
 sides.sort((a,b)=>
  Math.hypot(x-oldX-a.x*step,z-oldZ-a.z*step)-
  Math.hypot(x-oldX-b.x*step,z-oldZ-b.z*step)
 );
 for(const side of sides){
  const sx=oldX+side.x*step;
  const sz=oldZ+side.z*step;
  if(!collides(sx,sz,.4)){
   enemy.position.x=sx;
   enemy.position.z=sz;
   break;
  }
 }
 return distance;
}

// PLAYER SHOOTING
const raycaster=new THREE.Raycaster();
const center=new THREE.Vector2(0,0);
const solidSet=new Set(solidMeshes);
const shootables=[...targets,...solidMeshes];

function shoot(){
 if(gameEnded||missionComplete)return;
 unlockAudio();
 if(ammo<=0){
  showMessage("OUT OF AMMO - RELOAD");
  return;
 }
 ammo--;
 recoil=.12;
 flashTimer=.15;
 muzzleFlash.visible=true;
 playerGunSound();
 updateHUD();

 camera.updateMatrixWorld(true);
 scene.updateMatrixWorld(true);
 raycaster.setFromCamera(center,camera);
 raycaster.far=100;

 const hits=raycaster.intersectObjects(shootables,false);
 const hit=hits.find(h=>
  solidSet.has(h.object)||
  (h.object.userData.enemy&&
   h.object.userData.enemy.userData.alive)
 );
 if(!hit){
  showMessage("MISSED");
  return;
 }
 if(solidSet.has(hit.object)){
  createImpact(hit.point);
  showMessage("OBJECT HIT");
  return;
 }
 const soldier=hit.object.userData.enemy;
 soldier.userData.health-=50;
 updateHealthBar(soldier);
 createImpact(hit.point);
 showHitmarker(soldier.userData.health<=0);
 hitSound();

 if(soldier.userData.health<=0){
  soldier.userData.alive=false;
  soldier.visible=false;
  soldier.userData.respawn=5;
  soldier.userData.flash.visible=false;
  eliminations++;
  updateHUD();
  showMessage("ENEMY ELIMINATED!");
 }else{
  const cover=findCover(soldier);
  if(cover){
   soldier.userData.coverPoint=cover;
   soldier.userData.mode="toCover";
   soldier.userData.coverTimer=2.8;
  }
  showMessage(cover?"ENEMY TAKING COVER!":"ENEMY HIT!");
 }
}
document.getElementById("fire")
.addEventListener("pointerdown",e=>{
 e.preventDefault();
 shoot();
});
document.getElementById("reload")
.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(gameEnded||missionComplete)return;
 unlockAudio();
 ammo=30;
 reloadSound();
 updateHUD();
 showMessage("RELOADED");
});

// ENEMY LINE OF SIGHT
const sightRay=new THREE.Raycaster();
function enemyHasClearShot(enemy){
 enemy.updateMatrixWorld(true);
 scene.updateMatrixWorld(true);
 const start=enemy.localToWorld(
  new THREE.Vector3(.3,1.55,1.8)
 );
 const dir=camera.position.clone().sub(start);
 const distance=dir.length();
 if(distance<.1)return true;
 sightRay.set(start,dir.normalize());
 sightRay.far=distance;
 return sightRay.intersectObjects(solidMeshes,false).length===0;
}

// ENEMY GUNFIRE
function enemyFire(enemy,distance){
 const d=enemy.userData;
 d.flashTime=.42;
 d.flash.visible=true;
 enemy.updateMatrixWorld(true);
 const start=enemy.localToWorld(
  new THREE.Vector3(.3,1.55,1.8)
 );
 const end=camera.position.clone();
 end.x+=(Math.random()-.5)*.5;
 end.y+=(Math.random()-.5)*.5;
 end.z+=(Math.random()-.5)*.5;
 createTracer(start,end);
 enemyGunSound(distance);
 takeDamage(10);
}

// DAMAGE
function takeDamage(amount){
 if(gameEnded||missionComplete)return;
 health=Math.max(0,health-amount);
 damageFlash=.65;
 directionFlash=.65;
 updateHUD();
 showMessage("UNDER FIRE!");

 if(health<=0){
  gameEnded=true;
  moveX=0;moveY=0;
  setAiming(false);
  document.getElementById("resultTitle").textContent="MISSION FAILED";
  document.getElementById("finalscore").textContent=
   "Eliminations: "+eliminations;
  document.getElementById("gameover").style.display="flex";
 }
}

// MISSION
function updateMission(){
 if(gameEnded||missionComplete)return;
 if(eliminations<3){
  missionDisplay.textContent=
   `MISSION: ELIMINATE ${3-eliminations} MORE ENEMIES`;
  return;
 }
 missionDisplay.textContent="MISSION: REACH GREEN CHECKPOINT";
 const target=new THREE.Vector3();
 marker.getWorldPosition(target);
 if(Math.hypot(
  camera.position.x-target.x,
  camera.position.z-target.z
 )<2.5){
  missionComplete=true;
  moveX=0;moveY=0;
  setAiming(false);
  missionDisplay.textContent="MISSION COMPLETE!";
  document.getElementById("resultTitle").textContent="MISSION COMPLETE!";
  document.getElementById("finalscore").textContent=
   "Operation Steel City | Eliminations: "+eliminations;
  document.getElementById("gameover").style.display="flex";
 }
}
document.getElementById("restart")
.addEventListener("click",()=>location.reload());

// GAME LOOP
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 camera.fov=THREE.MathUtils.lerp(
  camera.fov,aiming?45:75,Math.min(1,dt*10)
 );
 camera.updateProjectionMatrix();

 gun.position.lerp(
  aiming?aimedGunPosition:normalGunPosition,
  Math.min(1,dt*12)
 );

 if(!gameEnded&&!missionComplete){
  const speed=aiming?3.5:6;
  const forward=-moveY*speed*dt;
  const sideways=moveX*speed*dt;
  const deltaX=-Math.sin(yaw)*forward+Math.cos(yaw)*sideways;
  const deltaZ=-Math.cos(yaw)*forward-Math.sin(yaw)*sideways;

  const nx=THREE.MathUtils.clamp(
   camera.position.x+deltaX,-8,8
  );
  if(!collides(nx,camera.position.z)){
   camera.position.x=nx;
  }
  const nz=THREE.MathUtils.clamp(
   camera.position.z+deltaZ,-75,75
  );
  if(!collides(camera.position.x,nz)){
   camera.position.z=nz;
  }

  for(const enemy of enemies){
   const d=enemy.userData;
   if(d.healthBar){
    d.healthBar.quaternion.copy(camera.quaternion);
   }

   d.flashTime=Math.max(0,d.flashTime-dt);
   d.flash.visible=d.alive&&d.flashTime>0;

   if(!d.alive){
    d.respawn-=dt;
    if(d.respawn<=0){
     d.alive=true;
     d.health=100;
     enemy.visible=true;
     enemy.position.set(d.homeX,0,d.homeZ);
     d.cooldown=2;
     d.mode="patrol";
     d.coverPoint=null;
     d.flashTime=0;
     updateHealthBar(enemy);
    }
    continue;
   }

   d.phase+=dt;
   let dx=camera.position.x-enemy.position.x;
   let dz=camera.position.z-enemy.position.z;
   let distance=Math.hypot(dx,dz);
   enemy.rotation.y=Math.atan2(dx,dz);

   if(d.mode==="toCover"&&d.coverPoint){
    const remaining=moveToward(
     enemy,d.coverPoint.x,d.coverPoint.z,3.6,dt
    );
    if(remaining<.25)d.mode="inCover";
   }else if(d.mode==="inCover"){
    d.coverTimer-=dt;
    if(d.coverTimer<=0){
     d.mode="chase";
     d.coverPoint=null;
    }
   }else if(distance<28){
    d.mode="chase";
    if(distance>14){
     moveToward(
      enemy,camera.position.x,camera.position.z,2.2,dt
     );
    }
   }else{
    d.mode="patrol";
    const homeDistance=Math.hypot(
     d.homeX-enemy.position.x,
     d.homeZ-enemy.position.z
    );
    if(homeDistance>1){
     moveToward(enemy,d.homeX,d.homeZ,1.2,dt);
    }else{
     const patrolX=d.homeX+Math.sin(d.phase)*1.5;
     moveToward(enemy,patrolX,d.homeZ,1.2,dt);
    }
   }

   dx=camera.position.x-enemy.position.x;
   dz=camera.position.z-enemy.position.z;
   distance=Math.hypot(dx,dz);
   d.cooldown-=dt;

   if(
    d.mode!=="inCover"&&
    d.mode!=="toCover"&&
    distance<14&&
    d.cooldown<=0
   ){
    d.cooldown=2.5;
    if(enemyHasClearShot(enemy)){
     enemyFire(enemy,distance);
    }
   }
  }

  recoil=Math.max(0,recoil-dt*.5);
  flashTimer=Math.max(0,flashTimer-dt);
  muzzleFlash.visible=flashTimer>0;
  damageFlash=Math.max(0,damageFlash-dt);
  directionFlash=Math.max(0,directionFlash-dt);

  document.getElementById("damage").style.opacity=
   damageFlash*.8;
  document.getElementById("direction").style.opacity=
   directionFlash;

  updateMission();
 }

 gun.position.z+=recoil;

 for(let i=impactEffects.length-1;i>=0;i--){
  const e=impactEffects[i];
  e.life-=dt;
  e.mesh.material.opacity=Math.max(0,e.life/.25);
  e.mesh.scale.multiplyScalar(1+dt*3);
  if(e.life<=0){
   scene.remove(e.mesh);
   e.mesh.geometry.dispose();
   e.mesh.material.dispose();
   impactEffects.splice(i,1);
  }
 }

 for(let i=tracers.length-1;i>=0;i--){
  const t=tracers[i];
  t.life-=dt;
  t.mesh.material.opacity=Math.max(
   0,Math.min(1,t.life/.35)
  );
  if(t.life<=0){
   scene.remove(t.mesh);
   t.mesh.geometry.dispose();
   t.mesh.material.dispose();
   tracers.splice(i,1);
  }
 }

 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
window.addEventListener("error",e=>{
 const el=document.getElementById("error");
 el.style.display="block";
 el.textContent="Game error: "+e.message;
});
window.addEventListener("unhandledrejection",e=>{
 const el=document.getElementById("error");
 el.style.display="block";
 el.textContent="Game error: "+String(e.reason);
});
</script>
