
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pittsburgh Streets</title>
<style>
* {box-sizing:border-box}
html,body {
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#111;
 font-family:Arial,sans-serif;
 touch-action:none;
}
canvas {display:block;touch-action:none}
#title {
 position:absolute;top:15px;width:100%;
 text-align:center;color:white;
 font-size:22px;font-weight:bold;
 text-shadow:2px 2px 5px black;
 pointer-events:none;
}
#crosshair {
 position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);
 color:white;font-size:32px;
 pointer-events:none;
}
#hud {
 position:absolute;left:15px;bottom:170px;
 color:white;font-size:16px;
 text-shadow:1px 1px 3px black;
 pointer-events:none;
}
#score {
 position:absolute;top:55px;width:100%;
 text-align:center;color:#ffe36b;
 font-size:17px;font-weight:bold;
 pointer-events:none;
}
#message {
 position:absolute;top:90px;width:100%;
 text-align:center;color:#ffe36b;
 font-size:20px;font-weight:bold;
 text-shadow:1px 1px 4px black;
 pointer-events:none;
}
#joystick {
 position:absolute;bottom:30px;left:25px;
 width:125px;height:125px;
 border-radius:50%;
 border:2px solid #ffffff80;
 background:#ffffff35;
 touch-action:none;
}
#stick {
 position:absolute;top:36px;left:36px;
 width:50px;height:50px;
 border-radius:50%;background:#ffffffbb;
 pointer-events:none;
}
#fire {
 position:absolute;right:25px;bottom:45px;
 width:95px;height:95px;border-radius:50%;
 background:#c62828;color:white;
 border:3px solid white;
 font-size:19px;font-weight:bold;
 touch-action:none;
}
#reload {
 position:absolute;right:40px;bottom:150px;
 padding:10px 15px;background:#333c;
 color:white;border:1px solid white;
 border-radius:10px;font-weight:bold;
 touch-action:none;
}
</style>
</head>
<body>

<div id="title">PITTSBURGH STREETS</div>
<div id="score">ELIMINATIONS: 0</div>
<div id="message"></div>
<div id="crosshair">+</div>
<div id="hud">HEALTH: 100 | AMMO: 30</div>
<div id="joystick"><div id="stick"></div></div>
<button id="fire">FIRE</button>
<button id="reload">RELOAD</button>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91a6b2);
scene.fog=new THREE.Fog(0x91a6b2,25,110);

const camera=new THREE.PerspectiveCamera(
 75,innerWidth/innerHeight,0.1,200
);
camera.position.set(0,1.7,8);
camera.rotation.order="YXZ";

const renderer=new THREE.WebGLRenderer({
 antialias:true
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(
 0xffffff,0x555555,2
));
const sun=new THREE.DirectionalLight(
 0xffffff,2
);
sun.position.set(10,20,10);
scene.add(sun);

// Ground and road
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x527044})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

const road=new THREE.Mesh(
 new THREE.PlaneGeometry(12,160),
 new THREE.MeshStandardMaterial({color:0x303238})
);
road.rotation.x=-Math.PI/2;
road.position.y=0.02;
scene.add(road);

function makeBox(w,h,d,color,x,y,z){
 const box=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 box.position.set(x,y,z);
 scene.add(box);
 return box;
}

// Sidewalks
makeBox(3,.2,160,0x999999,-7.5,.1,0);
makeBox(3,.2,160,0x999999,7.5,.1,0);

// Buildings
const colors=[
 0x885544,0x777777,0x554c48,0x99775b
];
for(let i=0;i<12;i++){
 const z=15-i*12;
 const h=7+(i%4)*2;
 makeBox(8,h,9,colors[i%4],
  -13,h/2,z);
 makeBox(8,h+2,9,colors[(i+1)%4],
  13,(h+2)/2,z);
}

// Road markings
for(let z=-70;z<70;z+=9){
 const line=new THREE.Mesh(
  new THREE.PlaneGeometry(.25,4),
  new THREE.MeshBasicMaterial({color:0xffd447})
 );
 line.rotation.x=-Math.PI/2;
 line.position.set(0,.04,z);
 scene.add(line);
}

// Enemy soldiers
const enemies=[];
const enemyParts=[];

function createEnemy(x,z){
 const soldier=new THREE.Group();
 soldier.position.set(x,0,z);

 function part(w,h,d,color,px,py,pz){
  const mesh=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   new THREE.MeshStandardMaterial({color})
  );
  mesh.position.set(px,py,pz);
  soldier.add(mesh);
  enemyParts.push(mesh);
  return mesh;
 }

 // Boots and legs
 part(.35,.8,.4,0x252a25,-.24,.4,0);
 part(.35,.8,.4,0x252a25,.24,.4,0);

 // Military uniform
 part(1,1.1,.55,0x42543b,0,1.35,0);

 // Arms
 part(.3,.9,.4,0x42543b,-.65,1.4,0);
 part(.3,.9,.4,0x42543b,.65,1.4,0);

 // Head and helmet
 part(.55,.55,.5,0x9a7255,0,2.15,0);
 part(.75,.25,.7,0x303e2b,0,2.5,0);

 // Training target marker
 part(.45,.45,.04,0xff3333,0,1.4,.3);

 soldier.userData.health=100;
 soldier.userData.alive=true;
 scene.add(soldier);
 enemies.push(soldier);
 return soldier;
}

createEnemy(-3,-12);
createEnemy(3,-23);
createEnemy(-2,-35);
createEnemy(3,-48);
createEnemy(0,-62);

// Movement joystick
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let moveX=0,moveY=0,joyId=null;

function updateStick(e){
 const r=joystick.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const distance=Math.hypot(x,y);
 const max=37;

 if(distance>max){
  x=x/distance*max;
  y=y/distance*max;
 }
 moveX=x/max;
 moveY=y/max;
 stick.style.transform=
  "translate("+x+"px,"+y+"px)";
}

joystick.addEventListener("pointerdown",e=>{
 if(joyId!==null)return;
 joyId=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 updateStick(e);
});
joystick.addEventListener("pointermove",e=>{
 if(e.pointerId===joyId)updateStick(e);
});
function stopStick(e){
 if(e.pointerId!==joyId)return;
 joyId=null;moveX=0;moveY=0;
 stick.style.transform="translate(0px,0px)";
}
joystick.addEventListener("pointerup",stopStick);
joystick.addEventListener("pointercancel",stopStick);

// Touch aiming
let lookId=null,lastX=0,lastY=0;
let yaw=0,pitch=0;

renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.clientX<innerWidth*.35 || lookId!==null)return;
 lookId=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId!==lookId)return;
 yaw-=(e.clientX-lastX)*.004;
 pitch-=(e.clientY-lastY)*.004;
 pitch=Math.max(-1.2,Math.min(1.2,pitch));
 lastX=e.clientX;
 lastY=e.clientY;
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
});
function stopLook(e){
 if(e.pointerId===lookId)lookId=null;
}
renderer.domElement.addEventListener("pointerup",stopLook);
renderer.domElement.addEventListener("pointercancel",stopLook);

// Health, ammo, score
let health=100;
let ammo=30;
let eliminations=0;
const hud=document.getElementById("hud");
const score=document.getElementById("score");
const message=document.getElementById("message");
let messageTimer;

function updateHUD(){
 hud.textContent=
  "HEALTH: "+health+" | AMMO: "+ammo;
 score.textContent="ELIMINATIONS: "+eliminations;
}
function showMessage(text){
 message.textContent=text;
 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>{
  message.textContent="";
 },1000);
}

// Shooting raycaster
const raycaster=new THREE.Raycaster();
const center=new THREE.Vector2(0,0);

function shoot(){
 if(ammo<=0){
  showMessage("OUT OF AMMO - RELOAD");
  return;
 }
 ammo--;
 updateHUD();

 raycaster.setFromCamera(center,camera);
 raycaster.far=100;
 const hits=raycaster.intersectObjects(
  enemyParts,false
 );

 if(hits.length>0){
  const hit=hits[0].object;
  const soldier=hit.parent;

  if(soldier.userData.alive){
   soldier.userData.health-=50;

   if(soldier.userData.health<=0){
    soldier.userData.alive=false;
    soldier.visible=false;
    eliminations++;
    updateHUD();
    showMessage("ENEMY ELIMINATED!");

    setTimeout(()=>{
     soldier.userData.health=100;
     soldier.userData.alive=true;
     soldier.visible=true;
    },5000);
   }else{
    showMessage("ENEMY HIT!");
   }
  }
 }else{
  showMessage("MISSED");
 }

 const cross=document.getElementById("crosshair");
 cross.style.color="#ffdd44";
 setTimeout(()=>{
  cross.style.color="white";
 },100);
}

document.getElementById("fire")
 .addEventListener("pointerdown",e=>{
  e.preventDefault();
  shoot();
 });

document.getElementById("reload")
 .addEventListener("pointerdown",e=>{
  e.preventDefault();
  ammo=30;
  updateHUD();
  showMessage("RELOADED");
 });

// Animation loop
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 const speed=6;
 const forward=-moveY*speed*dt;
 const sideways=moveX*speed*dt;

 camera.position.x+=
  -Math.sin(yaw)*forward+
  Math.cos(yaw)*sideways;
 camera.position.z+=
  -Math.cos(yaw)*forward-
  Math.sin(yaw)*sideways;

 camera.position.x=Math.max(
  -8,Math.min(8,camera.position.x)
 );
 camera.position.z=Math.max(
  -75,Math.min(75,camera.position.z)
 );

 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
